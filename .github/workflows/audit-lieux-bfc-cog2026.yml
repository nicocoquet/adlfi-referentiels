name: Lieux — Bourgogne-Franche-Comté, audit COG 2026 (736 ARK, recette)
on:
  pull_request:
    paths:
      - '.github/workflows/audit-lieux-bfc-cog2026.yml'
      - 'scripts/auditer_lieux_bfc_cog.py'
      - 'scripts/recuperer_cog_2026.py'
      - 'scripts/instruire_exceptions_bfc_cog.py'
      - 'scripts/qualifier_relations_ark_bfc.py'
      - 'scripts/instruire_p2_bfc_cog.py'
      - 'scripts/instruire_p3_bfc_cog.py'
      - 'scripts/consolider_evenements_bfc_p1_p2_p3.py'
      - 'scripts/valider_graphe_historique_bfc.py'
      - 'scripts/preparer_lieux_temporel_bfc.py'
      - 'tests/test_preparer_lieux_temporel_bfc.py'
      - 'docs/assets/lieux-temps.js'
      - 'tests/test_lieux_temps.js'
      - 'docs/lieux/recette/MODELE-HISTORIQUE-TRANSVERSAL-BFC-20261114.md'
      - 'tests/test_consolider_evenements_bfc_p1_p2_p3.py'
      - 'docs/lieux/recette/LOT-P1-BFC-4-CANDIDATURES.csv'
      - 'docs/lieux/recette/LOT-P1-BFC-2-EVENEMENTS.csv'
      - 'docs/lieux/recette/LOT-P1-BFC-6-TRANSITIONS-COG.csv'
      - 'tests/test_instruire_p3_bfc_cog.py'
      - 'docs/lieux/recette/LOT-P3-BFC-20-CANDIDATURES.csv'
      - 'docs/lieux/recette/PREINSTRUCTION-P3-BFC-20-DOSSIERS-20261114.md'
      - 'tests/test_instruire_p2_bfc_cog.py'
      - 'docs/lieux/recette/LOT-P2-BFC-5-CANDIDATURES.csv'
      - 'docs/lieux/recette/LOT-P2-BFC-CONTEXTE-ARK-39177.csv'
      - 'tests/test_qualifier_relations_ark_bfc.py'
      - 'tests/test_instruire_exceptions_bfc_cog.py'
      - 'docs/lieux/recette/codes-historiques-absents-bfc-25.csv'
      - 'docs/lieux/recette/codes-partages-ark-bfc-2.csv'
      - 'tests/test_auditer_lieux_bfc_cog.py'
      - 'docs/lieux/recette/inventaire-bourgogne-franche-comte.csv'
      - 'docs/lieux/recette/lot-01-bourgogne-franche-comte.csv'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-bfc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contrôler les 736 ARK et l'identité du lot pilote
        run: |
          python3 -m unittest discover -s tests -p 'test_auditer_lieux_bfc_cog.py' -v
          python3 -m unittest discover -s tests -p 'test_instruire_exceptions_bfc_cog.py' -v
          python3 -m unittest discover -s tests -p 'test_qualifier_relations_ark_bfc.py' -v
          python3 -m unittest discover -s tests -p 'test_instruire_p2_bfc_cog.py' -v
          python3 -m unittest discover -s tests -p 'test_instruire_p3_bfc_cog.py' -v
          python3 -m unittest discover -s tests -p 'test_consolider_evenements_bfc_p1_p2_p3.py' -v
          python3 -m unittest discover -s tests -p 'test_preparer_lieux_temporel_bfc.py' -v
          node tests/test_lieux_temps.js
      - name: Récupérer les sources COG officielles (archive ou miroir public) et contrôler leurs SHA-256
        run: python3 scripts/recuperer_cog_2026.py --sortie /tmp/cog
      - name: Auditer les 736 autorités et générer le graphe de recette
        run: |
          python3 scripts/auditer_lieux_bfc_cog.py \
            --inventaire docs/lieux/recette/inventaire-bourgogne-franche-comte.csv \
            --communes /tmp/cog/v_commune_2026.csv \
            --historique /tmp/cog/v_commune_depuis_1943.csv \
            --mouvements /tmp/cog/v_mvt_commune_2026.csv \
            --sortie /tmp/bfc-736
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/bfc-736/rapport-cog-bfc-736.json').read_text(encoding='utf8'))
          assert (r['ark'],r['ark_avec_code'],r['ark_sans_code'])==(736,727,9)
          assert (r['codes_distincts'],r['codes_partages_par_ark'])==(725,2)
          assert (r['periodes_code_libelle_uniques'],r['lignes_mouvements_uniques'],r['etats_observes'])==(807,393,975)
          assert r['validations_nouvelles']==r['geometries_historiques']==0
          with Path('/tmp/bfc-736/SYNTHESE.md').open('w') as f:
              f.write('# Bourgogne-Franche-Comté — audit non validant des 736 ARK\n\n')
              f.write('**Avertissement de couverture :** les deux fichiers de Bourgogne datent de 2009, contre 21 fichiers Franche-Comté (1992–2011).\n\n')
              for k,v in r['categories_ark'].items():f.write(f'- {k}: {v}\n')
              f.write('\nAucune validation éditoriale nouvelle ni géométrie historique.\n')
          PY
          cat /tmp/bfc-736/SYNTHESE.md >> "$GITHUB_STEP_SUMMARY"
      - name: Instruire 25 codes historiques et quatre dossiers spécifiques
        run: |
          python3 scripts/instruire_exceptions_bfc_cog.py \
            --codes25 docs/lieux/recette/codes-historiques-absents-bfc-25.csv \
            --doubles docs/lieux/recette/codes-partages-ark-bfc-2.csv \
            --communes /tmp/cog/v_commune_2026.csv \
            --historique /tmp/cog/v_commune_depuis_1943.csv \
            --mouvements /tmp/cog/v_mvt_commune_2026.csv \
            --sortie /tmp/bfc-736/instruction-exceptions
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/bfc-736/instruction-exceptions/rapport-instruction-bfc.json').read_text())
          assert (r['nombre_codes_historiques'],r['lignes_evenements_officiels'],
                  r['codes_partages_ark_documentes'],r['communes_associees_interdepartementales'])==(25,42,2,2)
          assert r['nouveaux_alignements_valides']==0 and r['geometries_historiques_attribuees']==0
          with Path('/tmp/bfc-736/SYNTHESE.md').open('a') as f:
              f.write('\\n## 25 anciens codes et quatre dossiers particuliers\\n')
              for k,v in r['repartition_profils'].items():f.write(f'- {k}: {v}\\n')
              f.write('42 lignes de mouvements avant/après préservées ; aucune validation nouvelle.\\n')
          PY
          cat /tmp/bfc-736/instruction-exceptions/rapport-instruction-bfc.json >> "$GITHUB_STEP_SUMMARY"
      - name: Qualifier les relations candidates entre autorités sans fusion d'ARK
        run: |
          set -euo pipefail
          for dest in /tmp/bfc-736/relations-candidates /tmp/bfc-736/relations-controle; do
            python3 scripts/qualifier_relations_ark_bfc.py \
              --inventaire docs/lieux/recette/inventaire-bourgogne-franche-comte.csv \
              --anciens /tmp/bfc-736/instruction-exceptions/instruction-25-codes-historiques.csv \
              --preuves /tmp/bfc-736/instruction-exceptions/preuves-mouvements-25.csv \
              --partages /tmp/bfc-736/instruction-exceptions/deux-codes-partages-ark.csv \
              --associes /tmp/bfc-736/instruction-exceptions/antorpe-frettes.csv \
              --sortie "$dest"
          done
          diff -qr /tmp/bfc-736/relations-candidates /tmp/bfc-736/relations-controle
          rm -rf /tmp/bfc-736/relations-controle
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/bfc-736/relations-candidates/rapport-relations-bfc.json').read_text())
          assert (r['candidatures_administratives_total'],
                  r['relations_entre_ark_candidates_non_validees'],
                  r['candidatures_sans_ark_cible_univoque'])==(29,15,14)
          assert (r['anciens_avec_libelle_cible_univoque'],r['anciens_avec_code_seul'],
                  r['anciens_sans_ark_cible_dans_corpus'])==(11,9,5)
          assert r['nouvelles_validations_adlfi']==0
          assert r['geometries_historiques_attribuees']==0
          with Path('/tmp/bfc-736/SYNTHESE.md').open('a') as f:
              f.write('\\n## Candidatures de relations historiques entre ARK\\n')
              f.write('29 relations administratives étudiées ; 15 ARK cibles lexicaux candidats, 14 à instruire.\\n')
              f.write('Aucune relation ARK–ARK publiée ou validée.\\n')
          PY
          cat /tmp/bfc-736/relations-candidates/rapport-relations-bfc.json >> "$GITHUB_STEP_SUMMARY"
      - name: Préinstruire cinq P2 BFC avec six événements administratifs
        run: |
          set -euo pipefail
          for dest in /tmp/bfc-736/preinstruction-p2 /tmp/bfc-736/controle-p2; do
            python3 scripts/instruire_p2_bfc_cog.py \
              --candidatures docs/lieux/recette/LOT-P2-BFC-5-CANDIDATURES.csv \
              --contexte-39177 docs/lieux/recette/LOT-P2-BFC-CONTEXTE-ARK-39177.csv \
              --communes /tmp/cog/v_commune_2026.csv \
              --mouvements /tmp/cog/v_mvt_commune_2026.csv \
              --sortie "$dest"
          done
          diff -qr /tmp/bfc-736/preinstruction-p2 /tmp/bfc-736/controle-p2
          rm -rf /tmp/bfc-736/controle-p2
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/bfc-736/preinstruction-p2/rapport-p2-bfc.json').read_text(encoding='utf8'))
          assert (r['candidatures_P2'],r['evenements_administratifs_distincts'],
                  r['mouvements_officiels_avant_apres'])==(5,6,19)
          assert r['creation_communes_nouvelles']==3 and r['fusions_associations']==2
          assert r['evenement_ulterieur_suppression_COMD']==1
          assert r['validations_editoriales']==r['nouvelles_equivalences_skos']==0
          assert r['geometries_historiques']==0
          with Path('/tmp/bfc-736/SYNTHESE.md').open('a') as f:
              f.write('\n## Préinstruction des cinq dossiers P2\n')
              f.write('3 créations de communes nouvelles, 2 fusions-associations ; 6 événements au total avec la suppression des communes déléguées en 2020.\n')
              f.write('19 lignes COG avant/après. Zéro décision éditoriale enregistrée.\n')
          PY
          cat /tmp/bfc-736/preinstruction-p2/rapport-p2-bfc.json >> "$GITHUB_STEP_SUMMARY"
      - name: Préinstruire les 20 P3 et vérifier 16 événements initiaux + 6 ultérieurs
        run: |
          set -euo pipefail
          for target in /tmp/bfc-736/preinstruction-p3 /tmp/bfc-736/controle-p3; do
            python3 scripts/instruire_p3_bfc_cog.py \
              --candidatures docs/lieux/recette/LOT-P3-BFC-20-CANDIDATURES.csv \
              --communes /tmp/cog/v_commune_2026.csv \
              --historique /tmp/cog/v_commune_depuis_1943.csv \
              --mouvements /tmp/cog/v_mvt_commune_2026.csv \
              --sortie "$target"
          done
          diff -qr /tmp/bfc-736/preinstruction-p3 /tmp/bfc-736/controle-p3
          rm -rf /tmp/bfc-736/controle-p3
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/bfc-736/preinstruction-p3/rapport-p3.json').read_text())
          assert (r['dossiers_P3'],r['evenements_initiaux_distincts'],
                  r['evenements_ulterieurs_distincts'],r['evenements_tous'])==(20,16,6,22)
          assert (r['lignes_initiales_COG'],r['lignes_ulterieures_COG'],
                  r['lignes_COG_uniques'])==(51,14,65)
          assert r['evenements_initiaux_deja_P2']==2
          assert r['validations_nouvelles']==r['equivalences_Skos_nouvelles']==0
          assert r['geometries_historiques']==0
          with Path('/tmp/bfc-736/SYNTHESE.md').open('a') as f:
              f.write('\n## Préinstruction des 20 dossiers P3\n')
              f.write('16 événements initiaux (2 déjà en P2), 6 événements ultérieurs, 65 lignes COG distinctes.\n')
              f.write('Aucune relation historique ou géométrie validée.\n')
          PY
          cat /tmp/bfc-736/preinstruction-p3/rapport-p3.json >> "$GITHUB_STEP_SUMMARY"
      - name: Joindre sources et méthode au lot P3 reproductible
        run: |
          cp docs/lieux/recette/LOT-P3-BFC-20-CANDIDATURES.csv /tmp/bfc-736/preinstruction-p3/
          cp scripts/instruire_p3_bfc_cog.py /tmp/bfc-736/preinstruction-p3/
          cp tests/test_instruire_p3_bfc_cog.py /tmp/bfc-736/preinstruction-p3/
          cp docs/lieux/recette/PREINSTRUCTION-P3-BFC-20-DOSSIERS-20261114.md /tmp/bfc-736/preinstruction-p3/
      - name: Consolider les 29 relations P1/P2/P3 en graphe COG unique
        run: |
          set -euo pipefail
          for target in /tmp/bfc-736/transversal /tmp/bfc-736/transversal-controle; do
            python3 scripts/consolider_evenements_bfc_p1_p2_p3.py \
              --p1 docs/lieux/recette/LOT-P1-BFC-4-CANDIDATURES.csv \
              --p1-events docs/lieux/recette/LOT-P1-BFC-2-EVENEMENTS.csv \
              --p1-transitions docs/lieux/recette/LOT-P1-BFC-6-TRANSITIONS-COG.csv \
              --p2 docs/lieux/recette/LOT-P2-BFC-5-CANDIDATURES.csv \
              --p3 docs/lieux/recette/LOT-P3-BFC-20-CANDIDATURES.csv \
              --communes /tmp/cog/v_commune_2026.csv \
              --historique /tmp/cog/v_commune_depuis_1943.csv \
              --mouvements /tmp/cog/v_mvt_commune_2026.csv \
              --sortie "$target"
          done
          diff -qr /tmp/bfc-736/transversal /tmp/bfc-736/transversal-controle
          rm -rf /tmp/bfc-736/transversal-controle
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/bfc-736/transversal')
          r=json.loads((p/'rapport-transversal-bfc.json').read_text())
          assert (r['candidatures'],r['ark_cibles_candidats'],
                  r['groupes_evenements_uniques'],r['transitions_insee_distinctes']) == (29,28,28,86)
          assert (r['evenements_initiaux'],r['evenements_ulterieurs'],
                  r['references_evenements_anterieures']) == (21,7,30)
          assert r['validations_editoriales_nouvelles']==r['nouveaux_exactMatch_skos']==0
          assert r['geometries_historiques_attribuees']==0
          with Path('/tmp/bfc-736/SYNTHESE.md').open('a') as f:
              f.write('\n## Graphe historique transversal P1/P2/P3\n')
              f.write('29 relations documentaires, 28 événements uniques (21 initiaux et 7 ultérieurs), 86 lignes COG.\n')
              f.write('Tous les identifiants anciens conservés en table de correspondance ; aucune validation éditoriale.\n')
          PY
          cat /tmp/bfc-736/transversal/rapport-transversal-bfc.json >> "$GITHUB_STEP_SUMMARY"
      - name: Valider les références entre ARK, événements, mouvements et états
        run: |
          python3 scripts/valider_graphe_historique_bfc.py \
            --graphe /tmp/bfc-736/transversal/graphe-transversal-bfc.json
          python3 - <<'PY'
          import copy
          import json
          import sys
          import tempfile
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from valider_graphe_historique_bfc import controler
          original=json.loads(Path('/tmp/bfc-736/transversal/graphe-transversal-bfc.json').read_text())
          for sabotage in ('decision','mouvement','etat'):
              corrupted=copy.deepcopy(original)
              if sabotage=='decision':
                  corrupted['relations_candidates'][0]['decision_editoriale']='valide'
              elif sabotage=='mouvement':
                  corrupted['relations_candidates'][0]['preuve_mouvement_id']='mvt:introuvable'
              else:
                  corrupted['mouvements'][0]['etat_avant_id']='etat:introuvable'
              with tempfile.TemporaryDirectory() as d:
                  file=Path(d)/'corruption.json'
                  file.write_text(json.dumps(corrupted))
                  try:
                      controler(file)
                  except ValueError:
                      pass
                  else:
                      raise AssertionError('Altération non détectée : '+sabotage)
          print('Contrôles négatifs : décision, preuve et état altérés correctement rejetés.')
          PY
      - name: Préparer les états COG interrogables au premier janvier
        run: |
          set -euo pipefail
          for target in /tmp/bfc-736/temporal-v1 /tmp/bfc-736/temporal-controle; do
            python3 scripts/preparer_lieux_temporel_bfc.py \
              --graphe /tmp/bfc-736/transversal/graphe-transversal-bfc.json \
              --historique /tmp/cog/v_commune_depuis_1943.csv \
              --courant /tmp/cog/v_commune_2026.csv \
              --sortie "$target"
          done
          diff -qr /tmp/bfc-736/temporal-v1 /tmp/bfc-736/temporal-controle
          rm -rf /tmp/bfc-736/temporal-controle
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/bfc-736/temporal-v1')
          report=json.loads((root/'rapport-temporel-bfc.json').read_text())
          assert (report['codes_cog_couverts'],report['periodes_COM'],
                  report['statuts_complementaires_observes_uniquement_en_2026'],
                  report['evenements_COG'])==(53,69,3,28)
          assert report['nouvelles_validations']==report['geometries_historiques']==0
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Tester le curseur unique sur les transitions réelles
        run: |
          node - <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const model=JSON.parse(fs.readFileSync('/tmp/bfc-736/temporal-v1/lieux-temporel-bfc-recette.json'));
          const temporal=require('./docs/assets/lieux-temps.js');
          function label(year,code) {
            const s=temporal.auPremierJanvier(model,year);
            return s.etats_COM.find(x=>x.code_insee===code)?.libelle || null;
          }
          assert.equal(label(2017,'25368'),'Marchaux');
          assert.equal(label(2018,'25368'),'Marchaux-Chaudefontaine');
          assert.equal(label(2017,'25137'),'Chaudefontaine');
          assert.equal(label(2018,'25137'),null);
          assert.equal(label(2018,'39137'),'Chemilla');
          assert.equal(label(2019,'39137'),'Saint-Hymetière-sur-Valouse');
          assert.equal(label(2024,'71566'),'Verdun-sur-le-Doubs');
          assert.equal(label(2025,'71566'),'Verdun-Ciel');
          assert.equal(label(2016,'25575'),'Vaire-Arcier');
          assert.equal(label(2017,'25575'),'Vaire');
          assert.equal(label(1974,'39012'),'Antorpe');
          assert.equal(label(1975,'39012'),null); // pas de série historique COMA
          assert.equal(temporal.auPremierJanvier(model,2026).entites_complementaires.length,3);
          assert.equal(temporal.auPremierJanvier(model,1975).entites_complementaires.length,0);
          const index=temporal.creerIndexNoms(model);
          assert.equal(temporal.chercherNoms(index,'Chemilla')[0].code_insee,'39137');
          assert.equal(temporal.chercherNoms(index,'Marchaux')[0].code_insee,'25368');
          assert.equal(temporal.auPremierJanvier(model,2020).evenements_deja_survenus.some(
            ev=>ev.date_effet==='2020-03-15'),false);
          assert.deepEqual(model.geometries_historiques,[]);
          assert.deepEqual(model.validations_editoriales,[]);
          assert(!JSON.stringify(model).includes('26678/'),
              'Le rendu COG ne doit pas exposer de relation Pactols candidate');
          console.log('Projection temporelle réelle 1943–2026 : OK');
          JS
      - name: Ajouter le modèle temporel et ses contrôles à l'artefact
        run: |
          mkdir -p /tmp/bfc-736/temporal-v1/code
          cp scripts/preparer_lieux_temporel_bfc.py \
             docs/assets/lieux-temps.js \
             tests/test_preparer_lieux_temporel_bfc.py \
             tests/test_lieux_temps.js \
             /tmp/bfc-736/temporal-v1/code/
      - name: Joindre le code et les entrées du graphe transversal à l'artefact
        run: |
          mkdir -p /tmp/bfc-736/transversal/code /tmp/bfc-736/transversal/sources
          cp scripts/consolider_evenements_bfc_p1_p2_p3.py scripts/valider_graphe_historique_bfc.py tests/test_consolider_evenements_bfc_p1_p2_p3.py /tmp/bfc-736/transversal/code/
          cp docs/lieux/recette/MODELE-HISTORIQUE-TRANSVERSAL-BFC-20261114.md /tmp/bfc-736/transversal/
          cp docs/lieux/recette/LOT-P1-BFC-4-CANDIDATURES.csv \
             docs/lieux/recette/LOT-P1-BFC-2-EVENEMENTS.csv \
             docs/lieux/recette/LOT-P1-BFC-6-TRANSITIONS-COG.csv \
             docs/lieux/recette/LOT-P2-BFC-5-CANDIDATURES.csv \
             docs/lieux/recette/LOT-P3-BFC-20-CANDIDATURES.csv \
             /tmp/bfc-736/transversal/sources/
      - name: Archiver la recette seulement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-lieux-bfc-736-cog2026
          path: /tmp/bfc-736/
          retention-days: 90
          if-no-files-found: warn
