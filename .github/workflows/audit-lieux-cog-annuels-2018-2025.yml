name: Lieux — contrôler les archives 2018–2025 par leur COG annuel
on:
  pull_request:
    paths:
      - 'scripts/qualifier_cog_annuels_regions_departements.py'
      - 'tests/test_qualifier_cog_annuels_regions_departements.py'
      - '.github/workflows/audit-lieux-cog-annuels-2018-2025.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  cog-annuel:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester le parseur COG annuel
        run: python3 -m unittest discover -s tests -p 'test_qualifier_cog_annuels_regions_departements.py' -v
      - name: Récupérer les archives cartographiques déjà auditées ou les sources originales
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sources/archives"
          if gh run download 43869252036 --repo "$GITHUB_REPOSITORY" \
              --name adlfi-lieux-contours-2018-2025-audit-source \
              --dir "$RUNNER_TEMP/sources"; then
            echo "Archives Etalab restaurées depuis le rapport de recette du 16/11/2026."
          else
            echo "Artefact expiré : récupération à l’URL de chaque millésime."
            for year in 2018 2019 2021 2022 2023 2024 2025; do
              for level in regions departements; do
                name="$level-$year.geojson.gz"
                curl -fL --retry 10 --retry-all-errors --retry-delay 3 \
                  --connect-timeout 15 --max-time 90 \
                  "https://etalab-datasets.geo.data.gouv.fr/contours-administratifs/$year/geojson/$level-100m.geojson.gz" \
                  -o "$RUNNER_TEMP/sources/archives/$name"
              done
            done
          fi
          test "$(find "$RUNNER_TEMP/sources/archives" -name '*.geojson.gz' | wc -l)" -eq 14
          python3 - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import auditer_contours_region_departement_2018_2025 as a
          for p in (Path(os.environ["RUNNER_TEMP"])/"sources/archives").glob("*.geojson.gz"):
              a.lire_geojson(p,originaire=True)
          print("Les 14 originaux SIG concordent avec les SHA256 de recette.")
          PY
      - name: Télécharger les COG Insee correspondants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cog"
          curl -fLsS --retry 10 --retry-all-errors --retry-delay 3 \
            --connect-timeout 15 --max-time 90 \
            https://www.insee.fr/fr/statistiques/fichier/3363419/reg2018-txt.zip \
            -o "$RUNNER_TEMP/cog/regions-2018-txt.zip"
          curl -fLsS --retry 10 --retry-all-errors --retry-delay 3 \
            --connect-timeout 15 --max-time 90 \
            https://www.insee.fr/fr/statistiques/fichier/3363419/depts2018-txt.zip \
            -o "$RUNNER_TEMP/cog/departements-2018-txt.zip"
          for spec in 2019:3720946 2021:5057840 2022:6051727 2023:6800675 2024:7766585 2025:8377162; do
            IFS=: read -r year source_id <<< "$spec"
            curl -fLsS --retry 10 --retry-all-errors --retry-delay 3 \
              --connect-timeout 15 --max-time 90 \
              "https://www.insee.fr/fr/statistiques/fichier/$source_id/cog_ensemble_$year""_csv.zip" \
              -o "$RUNNER_TEMP/cog/cog_ensemble_$year""_csv.zip"
          done
          python3 - <<'PY'
          import os,zipfile
          from pathlib import Path
          for p in sorted((Path(os.environ["RUNNER_TEMP"])/"cog").glob("*.zip")):
              with zipfile.ZipFile(p) as z:
                  names=[x for x in z.namelist() if ("region" in x.lower() or "departement" in x.lower()
                          or x.lower().endswith(("reg2018.txt","depts2018.txt")))]
                  print(p.name, p.stat().st_size, names[:14])
          PY
      - name: Vérifier chaque rattachement département/région au COG de son année
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/qualifier_cog_annuels_regions_departements.py \
            --archives-cog "$RUNNER_TEMP/cog" \
            --archives-geo "$RUNNER_TEMP/sources/archives" \
            --sortie "$RUNNER_TEMP/cog-annuel-1.json"
          python3 scripts/qualifier_cog_annuels_regions_departements.py \
            --archives-cog "$RUNNER_TEMP/cog" \
            --archives-geo "$RUNNER_TEMP/sources/archives" \
            --sortie "$RUNNER_TEMP/cog-annuel-2.json"
          cmp "$RUNNER_TEMP/cog-annuel-1.json" "$RUNNER_TEMP/cog-annuel-2.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"cog-annuel-1.json"
          d=json.loads(p.read_text())
          assert sorted(d["millésimes"])==sorted(map(str,[2018,2019,2021,2022,2023,2024,2025]))
          assert all(v["regions"]["nombre_codes"]==18 and v["departements"]["nombre_codes"]==101
                     for v in d["millésimes"].values())
          assert d["nouvelles_autorites_pactols"]==0
          print("COG annuel vérifié, 18 régions et 101 départements par millésime.")
          PY
      - name: Conserver les sources officielles et le rapport COG, hors site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adlfi-lieux-insee-cog-annuels-2018-2025
          path: |
            ${{ runner.temp }}/cog/
            ${{ runner.temp }}/cog-annuel-1.json
          retention-days: 30
          if-no-files-found: ignore
