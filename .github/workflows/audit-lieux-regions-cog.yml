name: Lieux — inventorier les millésimes COG régionaux 2015, 2016, 2026
on:
  pull_request:
    paths:
      - 'recette/lieux/ADR-HIERARCHIE-REGIONS-ZOOM-20261115.md'
      - '.github/workflows/audit-lieux-regions-cog.yml'
      - 'scripts/auditer_cog_regions_millesimes.py'
      - 'tests/test_auditer_cog_regions_millesimes.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventaire-regional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Télécharger les sources officielles Insee 2015, 2016 et 2026
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/regions-cog"
          curl -fSL --retry 3 --connect-timeout 20 --max-time 120 \
            'https://www.insee.fr/fr/statistiques/fichier/2560698/reg2015-txt.zip' \
            -o "$RUNNER_TEMP/regions-cog/reg2015-txt.zip"
          curl -fSL --retry 3 --connect-timeout 20 --max-time 120 \
            'https://www.insee.fr/fr/statistiques/fichier/2114819/reg2016-txt.zip' \
            -o "$RUNNER_TEMP/regions-cog/reg2016-txt.zip"
          curl -fSL --retry 3 --connect-timeout 20 --max-time 120 \
            'https://www.insee.fr/fr/statistiques/fichier/8740222/v_region_2026.csv' \
            -o "$RUNNER_TEMP/regions-cog/v_region_2026.csv"
          curl -fSL --retry 3 --connect-timeout 20 --max-time 120 \
            'https://www.insee.fr/fr/statistiques/fichier/2560698/depts2015-txt.zip' \
            -o "$RUNNER_TEMP/regions-cog/depts2015-txt.zip"
          curl -fSL --retry 3 --connect-timeout 20 --max-time 120 \
            'https://www.insee.fr/fr/statistiques/fichier/2114819/depts2016-txt.zip' \
            -o "$RUNNER_TEMP/regions-cog/depts2016-txt.zip"
          curl -fSL --retry 3 --connect-timeout 20 --max-time 120 \
            'https://www.insee.fr/fr/statistiques/fichier/8740222/v_departement_2026.csv' \
            -o "$RUNNER_TEMP/regions-cog/v_departement_2026.csv"
          python3 - <<'PY'
          import os,zipfile,hashlib,json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'regions-cog'
          report={}
          for name in ('reg2015-txt.zip','reg2016-txt.zip','v_region_2026.csv','depts2015-txt.zip','depts2016-txt.zip','v_departement_2026.csv'):
              path=root/name
              data=path.read_bytes()
              if not data:raise ValueError('Source vide : '+name)
              item={'octets':len(data),'sha256':hashlib.sha256(data).hexdigest()}
              if name.endswith('.zip'):
                  with zipfile.ZipFile(path) as archive:
                      members=[f for f in archive.infolist() if not f.is_dir()]
                      if not members:raise ValueError('Archive vide : '+name)
                      item['contenu']=[]
                      for m in members:
                          blob=archive.read(m)
                          for enc in ('utf-8-sig','latin-1'):
                              try:
                                  txt=blob.decode(enc)
                                  break
                              except UnicodeDecodeError:continue
                          item['contenu'].append({
                              'name':m.filename,'bytes':m.file_size,
                              'sha256':hashlib.sha256(blob).hexdigest(),
                              'preview_first_lines':txt.splitlines()[:5],
                              'lines':len(txt.splitlines())
                          })
              else:
                  item['first_lines']=data.decode('utf-8-sig').splitlines()[:5]
                  item['lines']=len(data.decode('utf-8-sig').splitlines())
              report[name]=item
          (root/'inventaire-sources-regions.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Tests de parsing et de qualification temporelle
        run: |
          python3 -m unittest discover -s tests -p 'test_auditer_cog_regions_millesimes.py' -v
      - name: Auditer les régions et rattachements départementaux à trois millésimes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/auditer_cog_regions_millesimes.py \
            --reg2015 "$RUNNER_TEMP/regions-cog/reg2015-txt.zip" \
            --reg2016 "$RUNNER_TEMP/regions-cog/reg2016-txt.zip" \
            --reg2026 "$RUNNER_TEMP/regions-cog/v_region_2026.csv" \
            --dep2015 "$RUNNER_TEMP/regions-cog/depts2015-txt.zip" \
            --dep2016 "$RUNNER_TEMP/regions-cog/depts2016-txt.zip" \
            --dep2026 "$RUNNER_TEMP/regions-cog/v_departement_2026.csv" \
            --sortie "$RUNNER_TEMP/regions-cog/recette"
          python3 scripts/auditer_cog_regions_millesimes.py \
            --reg2015 "$RUNNER_TEMP/regions-cog/reg2015-txt.zip" \
            --reg2016 "$RUNNER_TEMP/regions-cog/reg2016-txt.zip" \
            --reg2026 "$RUNNER_TEMP/regions-cog/v_region_2026.csv" \
            --dep2015 "$RUNNER_TEMP/regions-cog/depts2015-txt.zip" \
            --dep2016 "$RUNNER_TEMP/regions-cog/depts2016-txt.zip" \
            --dep2026 "$RUNNER_TEMP/regions-cog/v_departement_2026.csv" \
            --sortie "$RUNNER_TEMP/regions-cog/reproduction"
          diff -qr "$RUNNER_TEMP/regions-cog/recette" "$RUNNER_TEMP/regions-cog/reproduction"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"regions-cog/recette/rapport_region_2015_2016_2026.json"
          d=json.loads(p.read_text(encoding="utf8"))
          assert [d["annees"][str(y)]["regions"] for y in (2015,2016,2026)]==[27,18,18]
          assert all(d["annees"][str(y)]["departements"]==101 for y in (2015,2016,2026))
          assert d["fusions_regionales_2016"]==7
          assert d["anciennes_regions_fusionnees"]==16
          assert d["regions_ancien_millesime_reliees"]==27
          assert d["departements_reg_2015_differente_2016"]==65
          assert d["departements_reg_2016_differente_2026"]==0
          assert d["alignements_pactols_crees"]==0 and d["geometries_historiques_creees"]==0
          assert {x["code_reg"] for x in d["libelles_2016_2026_differents"]}=={"32","44","75","76"}
          print("COG régional audité et reproduit à l'octet")
          PY
      - name: Déposer les originaux de recette sans publier sur Pages
        uses: actions/upload-artifact@v4
        with:
          name: adlfi-lieux-cog-regions-2015-2016-2026-originaux
          path: ${{ runner.temp }}/regions-cog/
          retention-days: 30
