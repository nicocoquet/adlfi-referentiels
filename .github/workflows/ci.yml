name: Vérifications du référentiel

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # nécessaire aux instantanés immuables des recettes historiques
      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester le schéma et l'export des médias
        run: python3 -m unittest discover -s tests -v
      - name: Contrôler la syntaxe JavaScript
        run: |
          node --check docs/assets/personnes.js
          node --check docs/assets/organismes.js
          node --check docs/assets/lieux-search.js
          node --check docs/assets/lieux.js
          node --check docs/assets/lieux-chronologie-core.js
          node --check docs/assets/lieux-multiechelon.js
      - name: Vérifier la recherche et les sélections géographiques
        run: node tests/test_lieux_search.js
      - name: Vérifier les classements de tutelles
        run: node tests/test_tutelles_order.js
      - name: Vérifier les successions et liens entre autorités
        run: node tests/test_evolution.js
      - name: Vérifier les filiations historiques et les tutelles temporelles
        run: node tests/test_relations_historiques.js
      - name: Vérifier les cartouches uniformisés et les liens des autorités
        run: node tests/test_cartouches_uniformes.js
      - name: Vérifier les fiches hors catalogue navigables
        run: node tests/test_organismes_fiches_contextuelles.js
      - name: Vérifier les affiliations fédérales réciproques
        run: node tests/test_affiliations_federales.js
      - name: Vérifier les alias d'identifiants anciens
        run: node tests/test_aliases_organismes.js
      - name: Vérifier les statuts documentaires sans masquer les fiches
        run: node tests/test_validation_documentaire_organismes.js
