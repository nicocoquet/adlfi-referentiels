name: Réparer une référence de média existant (exécution unique)
on:
  push:
    branches:
      - fix/organismes-0023-media-ref-20261114
    paths:
      - .github/workflows/fix-org-0023-once.yml
permissions:
  contents: write
jobs:
  correct-one-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Raccorder tous les médias publiés au contrat exact de l'exporteur
        run: |
          python3 - <<'PY'
          import json
          import sys
          from collections import Counter
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import export_organismes
          source=Path('docs/data/organismes.json')
          original=source.read_text(encoding='utf-8')
          data=json.loads(original)
          provenance=data['provenance']['source_filename']
          print('Provenance maître publiée :',provenance)
          assert provenance.startswith('AdlFI_referentiel_1-49_'), 'Instantané hors 1.49 : arbitrage nécessaire'
          assert original==json.dumps(data,ensure_ascii=False,indent=2), 'Format du JSON inattendu'
          modifications=[]
          for record in data['authorities']:
              ident=record['id']
              media=record['presentation']['media']
              expected=export_organismes.media_for(ident)
              for role in ('logo','image'):
                  if media[role]!=expected[role]:
                      modifications.append((ident,role,media[role],expected[role]))
                      media[role]=expected[role]
          assert 1<=len(modifications)<=350, 'Cardinalité de corrections inattendue'
          for ident,role,old,new in modifications:
              print(f'{ident} / {role}: {old} -> {new}')
          for record in data['authorities']:
              for role in ('logo','image'):
                  ref=record['presentation']['media'][role]
                  assert ref is None or (Path('docs')/ref).is_file(), (record['id'],role,ref)
          source.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          counts=Counter(role for _,role,_,_ in modifications)
          print('Total des références rectifiées :',len(modifications),dict(counts))
          with open('corrections-medias.txt','w',encoding='utf-8') as out:
              out.write('Source maître : '+provenance+'\n')
              out.write('Les références sont réconciliées avec media_for() de l’exporteur.\n')
              out.write('\n'.join(f'{ident};{role};{old};{new}' for ident,role,old,new in modifications))
              out.write('\n')
          PY
      - name: Exécuter le contrôle des médias avant commit
        run: python3 -m unittest discover -s tests -p test_export.py -v
      - name: Enregistrer la correction sur la seule branche de travail
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/data/organismes.json
          git diff --cached --check
          git diff --cached --numstat
          git commit -m "fix(organismes): pointer ORG-0023 vers le JPEG canonique existant"
          git push origin HEAD:fix/organismes-0023-media-ref-20261114
