name: Lieux — recette des URI INSEE UUID en BFC (Pactols/COG 2026)

on:
  pull_request:
    paths:
      - 'scripts/auditer_uris_insee_uuid_pactols_2026.py'
      - 'tests/test_auditer_uris_insee_uuid_pactols_2026.py'
      - 'recette/lieux/BFC-URI-INSEE-UUID-RECETTE.md'
      - '.github/workflows/lieux-bfc-uris-insee-uuid-2026.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventorier-uuid:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: referentiels
      - uses: actions/checkout@v4
        with:
          repository: frantiq/PACTOLS
          ref: 69bf9697e24cefd645a69465bbd271702786285a
          path: pactols
          lfs: true
          sparse-checkout: |
            pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests de non-validation et de reconnaissance des UUID
        working-directory: referentiels
        run: python3 -m unittest discover -s tests -p 'test_auditer_uris_insee_uuid_pactols_2026.py' -v
      - name: Vérifier le RDF Pactols épinglé
        run: |
          echo '3a0effe42a27da20c30497a6847fc1becbb736745945f01e4321b4791f0067c7  pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf' | sha256sum --check
      - name: Acquérir le COG 2026
        working-directory: referentiels
        run: python3 scripts/recuperer_cog_2026.py --sortie "$RUNNER_TEMP/cog2026"
      - name: Construire deux inventaires déterministes
        working-directory: referentiels
        run: |
          set -euo pipefail
          for n in 1 2; do
            python3 scripts/auditer_uris_insee_uuid_pactols_2026.py \
              --rdf ../pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf \
              --cog "$RUNNER_TEMP/cog2026/v_commune_2026.csv" \
              --sortie "$RUNNER_TEMP/insee-uuid-bfc-$n.json"
          done
          cmp "$RUNNER_TEMP/insee-uuid-bfc-1.json" "$RUNNER_TEMP/insee-uuid-bfc-2.json"
          python3 - "$RUNNER_TEMP/insee-uuid-bfc-1.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["statut"]=="RECETTE_NON_VALIDANTE"
          assert d["communes_bfc_COG_2026"]==3685
          assert d["concepts_RDF_examines"]==50556
          assert d["concepts_avec_exactMatch_uuid_INSEE"]==26
          assert d["concepts_uuid_concernant_potentiellement_BFC"]==1
          val=d["candidats_val_d_usiers_25060"]
          assert len(val)==1
          assert val[0]["ark"]=="26678/pcrtksq5m3cwb846scr9wzkv"
          assert val[0]["uris_insee_uuid_exactMatch"]==["http://id.insee.fr/geo/commune/52976ff6-5685-48c9-b468-7417ad44b653"]
          assert val[0]["codes_bfc_directement_assertes"]==[]
          assert d["nouvelles_validations"]==0
          assert d["modifications_index_public"]==0
          assert d["geometries_historiques_inferrees"]==0
          assert all(p["code_cog_resolu_par_uuid"] is None for p in d["concepts"])
          assert all(p["publication"]=="NON_PUBLIE" for p in d["concepts"])
          print("UUID_BFC_BILAN",json.dumps({
            "total_uuid":d["concepts_avec_exactMatch_uuid_INSEE"],
            "concerne_bfc":d["concepts_uuid_concernant_potentiellement_BFC"],
            "val_d_usiers":d["candidats_val_d_usiers_25060"]},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: audit-insee-uuid-pactols-bfc-2026
          path: /home/runner/work/_temp/insee-uuid-bfc-1.json
          retention-days: 30
          if-no-files-found: error
