name: Lieux — extraction source des 360 ARK corses pour publication

on:
  pull_request:
    paths:
      - '.github/workflows/lieux-corse-source-publication-2026.yml'
      - 'scripts/preparer_validations_pactols_corse_2026.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extraction:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: referentiels
      - uses: actions/checkout@v4
        with:
          repository: frantiq/PACTOLS
          ref: 69bf9697e24cefd645a69465bbd271702786285a
          path: pactols
          lfs: true
          sparse-checkout: |
            pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier la source RDF
        run: |
          echo '3a0effe42a27da20c30497a6847fc1becbb736745945f01e4321b4791f0067c7  pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf' | sha256sum --check
      - name: Télécharger le COG 2026 épinglé
        working-directory: referentiels
        run: python3 scripts/recuperer_cog_2026.py --sortie "$RUNNER_TEMP/cog2026"
      - name: Extraire les décisions individuelles pour l'intégration
        working-directory: referentiels
        run: |
          set -euo pipefail
          python3 scripts/preparer_validations_pactols_corse_2026.py \
            --rdf ../pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf \
            --cog "$RUNNER_TEMP/cog2026/v_commune_2026.csv" \
            --sortie "$RUNNER_TEMP/corse-publication.csv"
          python3 - "$RUNNER_TEMP/corse-publication.csv" <<'PY'
          import csv,json,sys
          with open(sys.argv[1],encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f,delimiter=';'))
          assert len(rows)==360
          assert len({r['code_insee'] for r in rows})==360
          assert len({r['ark_pactols'] for r in rows})==360
          for r in rows:
              print('CORSE_ENTRY_JSON',json.dumps(r,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: registre-source-360-corse-2026
          path: ${{ runner.temp }}/corse-publication.csv
          retention-days: 30
