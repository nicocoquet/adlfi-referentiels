name: Lieux — registre des 360 correspondances Pactols Corse

on:
  pull_request:
    paths:
      - 'scripts/preparer_validations_pactols_corse_2026.py'
      - 'tests/test_preparer_validations_pactols_corse_2026.py'
      - 'recette/lieux/CORSE-360-VALIDATIONS-PACTOLS-2026.md'
      - '.github/workflows/lieux-corse-validations-pactols-2026.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  produire-registre:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: referentiels
      - uses: actions/checkout@v4
        with:
          repository: frantiq/PACTOLS
          ref: 69bf9697e24cefd645a69465bbd271702786285a
          path: pactols
          lfs: true
          sparse-checkout: |
            pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester les codes et le registre
        working-directory: referentiels
        run: python3 -m unittest discover -s tests -p 'test_preparer_validations_pactols_corse_2026.py' -v
      - name: Contrôler la version RDF Pactols
        run: |
          echo '3a0effe42a27da20c30497a6847fc1becbb736745945f01e4321b4791f0067c7  pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf' | sha256sum --check
      - name: Acquérir le COG 2026 officiel épinglé
        working-directory: referentiels
        run: python3 scripts/recuperer_cog_2026.py --sortie "$RUNNER_TEMP/cog2026"
      - name: Générer le registre 360 deux fois, contrôler l'égalité
        working-directory: referentiels
        run: |
          set -euo pipefail
          for i in 1 2; do
            python3 scripts/preparer_validations_pactols_corse_2026.py \
              --rdf ../pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf \
              --cog "$RUNNER_TEMP/cog2026/v_commune_2026.csv" \
              --sortie "$RUNNER_TEMP/corse-360-$i.csv"
          done
          cmp "$RUNNER_TEMP/corse-360-1.csv" "$RUNNER_TEMP/corse-360-2.csv"
          python3 - "$RUNNER_TEMP/corse-360-1.csv" <<'PY'
          import csv,sys,collections
          with open(sys.argv[1],encoding='utf-8',newline='') as f:
              records=list(csv.DictReader(f,delimiter=';'))
          assert len(records)==360
          assert len({r['ark_pactols'] for r in records})==360
          assert len({r['code_insee'] for r in records})==360
          assert all(r['uri_insee'].split('/')[-1]==r['code_insee'] for r in records)
          assert all(r['statut_validation']=='VALIDE_ADLFI_2026' for r in records)
          assert all(r['publication_site']=='EN_ATTENTE_RECETTE_PUBLICATION' for r in records)
          print('CORSE_360_COMPTAGES',dict(collections.Counter(r['departement_COG_2026'] for r in records)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: corse-360-validations-pactols-cog-2026
          path: ${{ runner.temp }}/corse-360-1.csv
          retention-days: 60
          if-no-files-found: error
