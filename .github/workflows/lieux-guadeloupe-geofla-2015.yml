name: Lieux — Guadeloupe GEOFLA 2015 / Etalab 2026 (recette)

on:
  pull_request:
    paths:
      - 'scripts/auditer_geofla_guadeloupe_2015.py'
      - 'tests/test_auditer_geofla_guadeloupe_2015.py'
      - 'recette/lieux/GUADELOUPE-GEOFLA-2015-2026-RECETTE.md'
      - '.github/workflows/lieux-guadeloupe-geofla-2015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-geofla-guadeloupe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances spatiales
        run: python3 -m pip install --disable-pip-version-check 'shapely==2.1.2' 'pyproj==3.7.2' 'pyshp==2.3.1'
      - name: Vérifier les partitions et l'absence de contours publiés sur exemples synthétiques
        run: python3 -m unittest discover -s tests -p 'test_auditer_geofla_guadeloupe_2015.py' -v
      - name: Télécharger la copie tierce GEOFLA 2015 de Guadeloupe
        run: |
          set -euo pipefail
          RAR="$RUNNER_TEMP/GEOFLA_2-1_COMMUNE_SHP_UTM20W84GUAD_D971_2015-12-01.rar"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://raw.githubusercontent.com/justinelliotmeyers/official_france_administrative_boundary_shapefile/master/GEOFLA_2-1_COMMUNE_SHP_UTM20W84GUAD_D971_2015-12-01.rar' \
            --output "$RAR"
          sha256sum "$RAR"
          test "$(stat -c %s "$RAR")" -ge 5000
          test "$(stat -c %s "$RAR")" -le 4000000
      - name: Télécharger les deux généralisations nationales 2026 déjà épinglées
        run: |
          set -euo pipefail
          for metres in 100 50; do
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 \
              "https://etalab-datasets.geo.data.gouv.fr/contours-administratifs/2026/geojson/communes-$metres"m.geojson.gz \
              --output "$RUNNER_TEMP/communes-$metres"m.geojson.gz
          done
          echo "4530cbf87a3af387c2da95935376f74b93eabd0a7595eacc5b7e0ed94a0b3778  $RUNNER_TEMP/communes-100m.geojson.gz" | sha256sum --check
          echo "6db43cd98a7211516da64e91761100504ba3feeddc986ebe0d50f84df624cd38  $RUNNER_TEMP/communes-50m.geojson.gz" | sha256sum --check
      - name: Extraire l'archive RAR après contrôle des chemins et de la taille
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-tools
          RAR="$RUNNER_TEMP/GEOFLA_2-1_COMMUNE_SHP_UTM20W84GUAD_D971_2015-12-01.rar"
          bsdtar -tf "$RAR" > "$RUNNER_TEMP/geofla-archive-files.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path,PurePosixPath
          items=(Path(os.environ["RUNNER_TEMP"])/"geofla-archive-files.txt").read_text().splitlines()
          assert 4<=len(items)<=100,len(items)
          for entry in items:
              p=PurePosixPath(entry)
              assert not p.is_absolute() and ".." not in p.parts and "\\" not in entry,entry
          print("FICHIERS ARCHIVE",len(items))
          PY
          mkdir "$RUNNER_TEMP/geofla"
          bsdtar -xf "$RAR" -C "$RUNNER_TEMP/geofla"
      - name: Exécuter deux fois le même audit et contrôler les octets
        run: |
          set -euo pipefail
          for n in 1 2; do
            python3 scripts/auditer_geofla_guadeloupe_2015.py \
              --dossier "$RUNNER_TEMP/geofla" \
              --archive "$RUNNER_TEMP/GEOFLA_2-1_COMMUNE_SHP_UTM20W84GUAD_D971_2015-12-01.rar" \
              --reference100 "$RUNNER_TEMP/communes-100m.geojson.gz" \
              --reference50 "$RUNNER_TEMP/communes-50m.geojson.gz" \
              --sortie "$RUNNER_TEMP/rapport-$n.json" > "$RUNNER_TEMP/resume-$n.txt"
          done
          cmp "$RUNNER_TEMP/rapport-1.json" "$RUNNER_TEMP/rapport-2.json"
          cat "$RUNNER_TEMP/resume-1.txt"
      - name: Vérifier les 32 codes et l'équation surfaces externe + 2 internes
        run: |
          python3 - <<'PY'
          import json,math,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"rapport-1.json").read_text())
          assert r["schema"]=="adlfi.lieux.guadeloupe.audit.geofla2015-etalab2026.v1"
          assert r["statut"]=="AUDIT_NON_VALIDANT_SOURCE_TIERCE_NON_AUTHENTIFIEE"
          assert r["sources"]["copie_2015"]["identite_originale_IGN_authentifiee"] is False
          assert r["sources"]["copie_2015"]["metadonnees"]["crs_equivalent_epsg32620"] is True
          assert r["sources"]["copie_2015"]["metadonnees"]["codes_champ"]=={"INSEE_COM":32}
          assert r["communes_COG_2026"]==32
          assert r["nouvelles_relations_Pactols"]==0
          assert r["geometries_historiques_adoptees"]==0
          assert r["publication_docs"] is False
          assert r["sources"]["contours2026"]["100m_sha256"]=="4530cbf87a3af387c2da95935376f74b93eabd0a7595eacc5b7e0ed94a0b3778"
          assert r["sources"]["contours2026"]["50m_sha256"]=="6db43cd98a7211516da64e91761100504ba3feeddc986ebe0d50f84df624cd38"
          for key in ("etats_2026_100m","etats_2026_50m"):
            a=r[key]
            assert a["communes"]==32
            assert len(a["toutes_communes"])==32
            assert {x["code"] for x in a["toutes_communes"]}=={f"971{i:02d}" for i in range(1,35) if i not in (23,27)}
            assert abs(a["cumul_ecarts_communaux_km2"]-
                      a["ecart_emprise_exterieure_km2"]-
                      2*a["ecart_entre_codes_interieur_unique_km2"])<=0.000005
            assert all(math.isfinite(x["jaccard_pct"]) and 0<=x["jaccard_pct"]<=100
                       for x in a["toutes_communes"])
            for group in a["composantes_exterieures"].values():
              assert group["composantes_exportees"]<=7
              for part in group["plus_grandes"]:
                lon,lat=part["point_interieur_wgs84_lonlat"]
                assert -62.3<lon<-60.7 and 15.5<lat<16.8
                assert "geometry" not in part and "coordinates" not in part
          print("LOCALISATION EMPRISES EXTERNES",json.dumps({
            reference:{
              direction:details["plus_grandes"][:7]
              for direction,details in r["etats_2026_"+reference]["composantes_exterieures"].items()}
            for reference in ("100m","50m")
          },ensure_ascii=False,indent=2))
          print("BILAN 32 COMMUNES",json.dumps({
            "source2015":r["sources"]["copie_2015"]["empreinte_sha256"],
            "crs_source":r["sources"]["copie_2015"]["metadonnees"],
            "ecart_100m":r["etats_2026_100m"]["ecart_emprise_exterieure_km2"],
            "ecart_50m":r["etats_2026_50m"]["ecart_emprise_exterieure_km2"],
            "generalisation_2026":r["difference_emprise_2026_100m_50m_km2"],
            "principaux_ecarts":r["etats_2026_100m"]["principaux_ecarts_communaux"][:6]
          },ensure_ascii=False,indent=2))
          PY
      - name: Archiver uniquement le rapport numérique de diagnostic (sans polygones)
        uses: actions/upload-artifact@v4
        with:
          name: adlfi-guadeloupe-geofla2015-vs-etalab2026-audit
          path: ${{ runner.temp }}/rapport-1.json
          retention-days: 30
          if-no-files-found: error
