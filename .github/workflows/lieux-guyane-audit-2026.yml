name: Lieux — Guyane 22 communes COG, historique et candidats Pactols

on:
  pull_request:
    paths:
      - 'scripts/auditer_guyane_2026.py'
      - 'scripts/verifier_index_public_guyane_2026.py'
      - 'docs/data/lieux-guyane/**'
      - 'scripts/construire_chronologie_guyane.py'
      - 'tests/test_construire_chronologie_guyane.py'
      - 'recette/lieux/GUYANE-CANDIDATS-HISTORIQUES-PACTOLS-2026.csv'
      - 'recette/lieux/GUYANE-CHRONOLOGIE-RECETTE.md'
      - 'tests/test_auditer_guyane_2026.py'
      - 'recette/lieux/GUYANE-LOT-01-2026.md'
      - 'recette/lieux/GUYANE-LOT-01-RESULTATS.md'
      - 'recette/lieux/GUYANE-VALIDATIONS-PACTOLS-COG-2026.csv'
      - 'recette/lieux/POLITIQUE-ALIGNEMENT-PACTOLS-COG.md'
      - 'scripts/extraire_index_public_outremer_2026.py'
      - 'tests/test_validations_guyane_pactols_2026.py'
      - 'docs/data/lieux-outremer/recherche-2026.json'
      - 'docs/data/manifest.json'
      - '.github/workflows/lieux-guyane-audit-2026.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instruction-guyane:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Code AdlFI
        uses: actions/checkout@v4
        with:
          path: referentiels
      - name: Source Pactols Lieux RDF officielle épinglée (Git LFS)
        uses: actions/checkout@v4
        with:
          repository: frantiq/PACTOLS
          ref: 69bf9697e24cefd645a69465bbd271702786285a
          path: pactols
          lfs: true
          sparse-checkout: |
            pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bibliothèques de contrôle des contours
        run: python3 -m pip install 'shapely==2.1.2' 'pyproj==3.7.2'
      - name: Tests synthétiques, sans réseau
        working-directory: referentiels
        run: python3 -m unittest discover -s tests -p 'test_auditer_guyane_2026.py' -v
      - name: Tester la chronologie guyanaise (dates d'effet et frontières non inférées)
        working-directory: referentiels
        run: python3 -m unittest discover -s tests -p 'test_construire_chronologie_guyane.py' -v
      - name: Tester les décisions Guyane appliquées à la projection publique
        working-directory: referentiels
        run: python3 -m unittest discover -s tests -p 'test_validations_guyane_pactols_2026.py' -v
      - name: Acquisition du COG Insee 2026 figé
        working-directory: referentiels
        run: python3 scripts/recuperer_cog_2026.py --sortie "$RUNNER_TEMP/cog2026"
      - name: Acquisition contrôlée des géométries communales 2026
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://etalab-datasets.geo.data.gouv.fr/contours-administratifs/2026/geojson/communes-100m.geojson.gz' \
            --output "$RUNNER_TEMP/communes-100m.geojson.gz"
          echo "4530cbf87a3af387c2da95935376f74b93eabd0a7595eacc5b7e0ed94a0b3778  $RUNNER_TEMP/communes-100m.geojson.gz" | sha256sum --check
      - name: Instruire 22 communes, toutes périodes COG 973 et Pactols
        working-directory: referentiels
        run: |
          set -euo pipefail
          for target in "$RUNNER_TEMP/recette1" "$RUNNER_TEMP/recette2"; do
            python3 scripts/auditer_guyane_2026.py \
              --cog-dir "$RUNNER_TEMP/cog2026" \
              --pactols-rdf ../pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf \
              --geojson "$RUNNER_TEMP/communes-100m.geojson.gz" \
              --public-index docs/data/lieux-outremer/recherche-2026.json \
              --sortie "$target"
          done
          diff -qr "$RUNNER_TEMP/recette1" "$RUNNER_TEMP/recette2"
      - name: Vérifier l'index historique public par comparaison exacte avec l'audit officiel
        working-directory: referentiels
        run: |
          python3 scripts/verifier_index_public_guyane_2026.py \
            --audit "$RUNNER_TEMP/recette1/guyane-22-communes-audit.json" \
            --public docs/data/lieux-guyane/chronologie-cog-2026.json
      - name: Contrôler la séparation de la preuve et de la validation
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"recette1"
          report=json.loads((root/"guyane-22-communes-audit.json").read_text())
          manifest=json.loads((root/"manifest-guyane.json").read_text())
          b=report["bilan"]
          assert b["communes_COG_2026"]==22
          assert b["codes_distincts_historiques_973"]==26
          assert b["periodes_historiques_973"]==41
          assert b["mouvements_impliquant_code_973"]==52
          assert b["candidatures_avec_uri_source"]==22
          assert b["source_Pactols_stats"]["liens_insee_rejetes_hors_communes_2026"]==4
          assert len(b["source_Pactols_stats"]["liens_insee_non_courants"])==4
          import csv
          with (root/"guyane-pactols-candidats-26.csv").open(encoding="utf-8-sig",newline="") as fh:
              candidats=list(csv.DictReader(fh,delimiter=";"))
          assert len(candidats)==26
          decisions=Path("referentiels/recette/lieux/GUYANE-VALIDATIONS-PACTOLS-COG-2026.csv")
          with decisions.open(encoding="utf-8-sig",newline="") as fh:
              approves=list(csv.DictReader(fh,delimiter=";"))
          current={x["code_insee_source"]:x for x in candidats
                   if x["statut_code_COG"]=="COMMUNE_COG_2026"}
          assert len(approves)==len(current)==22
          assert len({x["ark_pactols"] for x in approves})==22
          for row in approves:
              ref=current[row["code_insee"]]
              assert row["ark_pactols"]==ref["ark_pactols_source"]
              assert row["libelle_COG_2026"]==ref["libelle_COG"]
              assert row["uri_insee"]==ref["uri_insee_source"]
              assert row["predicat_source"]==ref["predicat_source"]=="exactMatch"
              assert row["concept_deprecie"]==ref["concept_deprecie"]=="non"
              assert row["prefLabel_fr_pactols"]==ref["prefLabel_fr_pactols"]
              assert row["portee_COG"]=="2026-01-01"
              assert row["statut_validation"]=="VALIDE_ADLFI_2026"
              # Un seul identifiant communal INSEE pour le même concept Pactols.
              audit_ark=[e for e in report["communes"]
                         if e["code_COG_2026"]==row["code_insee"]]
              assert len(audit_ark)==1
              li=audit_ark[0]["pactols_uri_insee_source"]
              assert len(li)==1
              assert li[0]["codes_communes_INSEE_exactMatch"]==[row["code_insee"]]
              assert li[0]["concept_remplace"] is False
              assert li[0]["concept_deprecie"] is False
          from hashlib import sha256
          raw=(root/"guyane-pactols-candidats-26.csv").read_bytes()
          assert sha256(raw).hexdigest()=="b9d7d7c84f1b5d5f39dee30a16cb2cbc18d10c1b13bd07964eea5fb5ba7f98dc"
          assert len({(x["code_insee_source"],x["ark_pactols_source"]) for x in candidats})==26
          assert {x["code_insee_source"] for x in candidats
                  if x["statut_code_COG"]=="CODE_COG_HISTORIQUE_NON_COURANT"} == {
                      "97351","97354","97355","97359"}
          assert all(x["predicat_source"]=="exactMatch" and
                     x["concept_deprecie"]=="non" and
                     x["decision_editoriale"].startswith("A_INSTRUIRE")
                     for x in candidats)
          assert b["geometries_topologiquement_valides"]==22
          assert b["correspondances_Pactols_validees_par_cet_audit"]==0
          assert b["contours_adoptes_par_cet_audit"]==0
          assert b["relations_de_succession_creees"]==0
          assert manifest["nouveaux_alignements_Pactols"]==0
          assert manifest["geometries_publiees"]==0
          assert {r["code_COG_2026"] for r in report["communes"]}=={
              "97301","97302","97303","97304","97305","97306","97307",
              "97308","97309","97310","97311","97312","97313","97314",
              "97352","97353","97356","97357","97358","97360","97361","97362"}
          assert all(r["statut_alignement_Pactols"]=="A_INSTRUIRE" for r in report["communes"])
          assert all(not r["geometrie_2026"]["contour_adopte"] for r in report["communes"])
          print("BILAN GUYANE",json.dumps(b,ensure_ascii=False,sort_keys=True,indent=2))
          print("CANDIDATS PACTOLS",json.dumps([
              {k:x[k] for k in ("code_insee_source","libelle_COG","ark_pactols_source",
                                "statut_code_COG","concordance_prefLabel_COG")}
              for x in candidats],ensure_ascii=False,sort_keys=True,indent=2))
          for x in report["communes"]:
              print("FICHE",x["code_COG_2026"],x["libelle_COG_2026"],
                    "episodes",len(x["historique_meme_code"]),
                    "mouvements",len(x["evenements_avec_code_2026"]),
                    "URI Pactols",len(x["pactols_uri_insee_source"]),
                    "labels Pactols",len(x["pactols_concordances_lexicales"]))
          PY
      - name: Construire deux fois les chronologies documentaires 1943–2026
        working-directory: referentiels
        run: |
          set -euo pipefail
          for sortie in "$RUNNER_TEMP/chrono1" "$RUNNER_TEMP/chrono2"; do
            python3 scripts/construire_chronologie_guyane.py \
              --audit "$RUNNER_TEMP/recette1/guyane-22-communes-audit.json" \
              --validations recette/lieux/GUYANE-VALIDATIONS-PACTOLS-COG-2026.csv \
              --historiques recette/lieux/GUYANE-CANDIDATS-HISTORIQUES-PACTOLS-2026.csv \
              --sortie "$sortie"
          done
          diff -qr "$RUNNER_TEMP/chrono1" "$RUNNER_TEMP/chrono2"
      - name: Contrôler le modèle chronologique non rétropolé
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"chrono1"
          meta=json.loads((root/"manifest-guyane-chronologie.json").read_text())
          stats=meta["statistiques"]
          assert stats["communes_COG_2026"]==22
          assert stats["codes_distincts_historique"]==26
          assert stats["periodes_COG"]==41
          assert stats["lignes_mouvements_COG"]==52
          assert stats["codes_historiques_disparus"]==4
          assert stats["liens_Pactols_actuels_valides_2026"]==22
          assert stats["liens_Pactols_historiques_valides"]==0
          assert stats["geometries_historiques_validees"]==0
          assert stats["nouvelles_succession_inferrees"]==0
          assert stats["etats_annuels"]==84
          assert meta["nouvelles_geometries"]==0
          assert meta["nouvelles_relations_Pactols"]==0
          states=json.loads((root/"guyane-etats-1943-2026.json").read_text())["etats"]
          selected={x["annee"]:x["total"] for x in states
                    if x["annee"] in (1943,1946,1953,1969,1970,1976,1977,1989,1993,2026)}
          assert selected=={
            1943:0,1946:0,1953:23,1969:23,1970:19,1976:19,
            1977:20,1989:21,1993:22,2026:22}
          assert stats["premiere_observation_COG"]=="1946-03-21"
          assert stats["dates_mouvements_distinctes"]==8
          hist=json.loads((root/"guyane-autorites-historiques.json").read_text())["candidats"]
          assert {r["code_insee_historique"] for r in hist} == {
            "97351","97354","97355","97359"}
          assert all(r["successeur_COG"]=="A_INSTRUIRE_A_PARTIR_DES_MOUVEMENTS"
                     for r in hist)
          assert {r["code_insee_historique"]:
                    r["mouvement_fusion_atteste_COG"]["code_destination"]
                  for r in hist}=={
                    "97351":"97301","97354":"97352",
                    "97355":"97306","97359":"97310"}
          assert all(r["mouvement_fusion_atteste_COG"]["date_effet_COG"]=="1969-03-27"
                     and not r["mouvement_fusion_atteste_COG"]["alignement_Pactols_avec_destination_valide"]
                     for r in hist)
          print("ETATS COG GUYANE",selected)
          print("STATISTIQUES CHRONOLOGIE",json.dumps(stats,ensure_ascii=False,indent=2))
          PY
      - name: Archiver les états et mouvements historiques sans géométrie
        uses: actions/upload-artifact@v4
        with:
          name: adlfi-guyane-chronologie-cog-1943-2026-recette
          path: ${{ runner.temp }}/chrono1/
          retention-days: 30
          if-no-files-found: error
      - name: Archiver les rapports Guyane sans publier les géométries
        uses: actions/upload-artifact@v4
        with:
          name: adlfi-lieux-guyane-22-audit-cog-pactols-2026
          path: ${{ runner.temp }}/recette1/
          retention-days: 30
          if-no-files-found: error
