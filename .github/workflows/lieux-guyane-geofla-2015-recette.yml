name: Lieux — identifier GEOFLA Guyane 2015 (source tierce non validante)

on:
  pull_request:
    paths:
      - 'scripts/auditer_geofla_guyane_2015.py'
      - 'tests/test_auditer_geofla_guyane_2015.py'
      - '.github/workflows/lieux-guyane-geofla-2015-recette.yml'
      - 'recette/lieux/GUYANE-GEOFLA-2015-PROVENANCE.md'
      - 'recette/lieux/GUYANE-GEOFLA-2015-COHERENCE-RECETTE.md'
      - 'recette/lieux/GUYANE-GEOFLA-2015-DECOMPOSITION.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventaire-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dépendances d'inventaire (Shapely, pyproj, pyshp)
        run: python3 -m pip install 'shapely==2.1.2' 'pyproj==3.7.2' 'pyshp==2.3.1'
      - name: Tests sans réseau
        run: python3 -m unittest discover -s tests -p 'test_auditer_geofla_guyane_2015.py' -v
      - name: Acquérir le paquet candidat GEOFLA 2015 depuis un miroir non officiel
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://raw.githubusercontent.com/justinelliotmeyers/official_france_administrative_boundary_shapefile/master/GEOFLA_2-1_COMMUNE_SHP_UTM22RGFG95_D973_2015-12-01.rar' \
            --output "$RUNNER_TEMP/GEOFLA_2-1_COMMUNE_SHP_UTM22RGFG95_D973_2015-12-01.rar"
          echo "3aac9e8b979118b25df48e9ef21fc1029d735cc3c99a025cd1f5688560f41298  $RUNNER_TEMP/GEOFLA_2-1_COMMUNE_SHP_UTM22RGFG95_D973_2015-12-01.rar" | sha256sum --check
          test "$(stat -c %s "$RUNNER_TEMP/GEOFLA_2-1_COMMUNE_SHP_UTM22RGFG95_D973_2015-12-01.rar")" -le 3000000
      - name: Acquérir les contours nationaux 2026 déjà contrôlés
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://etalab-datasets.geo.data.gouv.fr/contours-administratifs/2026/geojson/communes-100m.geojson.gz' \
            --output "$RUNNER_TEMP/communes-100m.geojson.gz"
          echo "4530cbf87a3af387c2da95935376f74b93eabd0a7595eacc5b7e0ed94a0b3778  $RUNNER_TEMP/communes-100m.geojson.gz" | sha256sum --check
      - name: Installer le lecteur d'archives RAR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-tools
      - name: Vérifier la liste des chemins avant extraction
        run: |
          export RAR="$RUNNER_TEMP/GEOFLA_2-1_COMMUNE_SHP_UTM22RGFG95_D973_2015-12-01.rar"
          bsdtar -tf "$RAR" > "$RUNNER_TEMP/liste-archive.txt"
          python3 - <<'PY'
          import os
          from pathlib import PurePosixPath,Path
          names=(Path(os.environ["RUNNER_TEMP"])/"liste-archive.txt").read_text().splitlines()
          assert 4<=len(names)<=100, len(names)
          for name in names:
              p=PurePosixPath(name)
              assert not p.is_absolute() and ".." not in p.parts and "\\" not in name, name
          print("Contenu préliminaire GEOFLA : ",names)
          PY
          mkdir -p "$RUNNER_TEMP/decompresse"
          bsdtar -xf "$RAR" -C "$RUNNER_TEMP/decompresse"
      - name: Inspecter les objets et comparer uniquement des métriques
        run: |
          python3 scripts/auditer_geofla_guyane_2015.py \
            --dossier "$RUNNER_TEMP/decompresse" \
            --archive "$RUNNER_TEMP/GEOFLA_2-1_COMMUNE_SHP_UTM22RGFG95_D973_2015-12-01.rar" \
            --national "$RUNNER_TEMP/communes-100m.geojson.gz" \
            --sortie "$RUNNER_TEMP/rapport-geofla-guyane-2015.json"
      - name: Vérifier l'absence de frontière géographique publiée
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"rapport-geofla-guyane-2015.json").read_text())
          assert r["statut"]=="AUDIT_SOURCE_TIERCE_NON_AUTHENTIFIEE"
          assert r["source2015"]["identite_source_IGN_confirmee"] is False
          assert r["source2015"]["sha256"]=="3aac9e8b979118b25df48e9ef21fc1029d735cc3c99a025cd1f5688560f41298"
          assert r["statistiques"]["fichiers_2015"]==22
          assert r["statistiques"]["codes_reconnus"]==22
          assert r["statistiques"]["codes_avec_comparaison_valide"]==22
          assert r["statistiques"]["geometries_2015_valides"]==22
          assert r["statistiques"]["codes_2015_non_uniques"]==[]
          assert r["statistiques"]["geometries_source_2015_dans_le_domaine_guyane"]==22
          assert r["source2015"]["epsg2972_attendu_selon_ign"]==2972
          assert isinstance(r["source2015"]["crs_equivalent_epsg2972"],bool)
          import math
          comp=r["source2015"]["controle_operationnel_epsg2972"]
          assert comp["nombre_points"]==22
          assert math.isfinite(comp["ecart_maximum_wgs84_m"])
          assert 0<=comp["ecart_moyen_wgs84_m"]<=comp["ecart_maximum_wgs84_m"]
          # Le WKT historique ne code pas explicitement RGFG95, mais les
          # transformations PROJ choisies pour cette recette coïncident.
          assert comp["ecart_maximum_wgs84_m"]<0.1
          assert r["source2015"]["datum_wkt"]
          assert r["source2015"]["ellipsoide_wkt"]
          assert r["source2015"]["projection_wkt"]
          assert r["source2015"]["parametres_projection_wkt"]
          print("COMPARAISON WKT / EPSG2972",json.dumps({
            "datum":r["source2015"]["datum_wkt"],
            "ellipsoide":r["source2015"]["ellipsoide_wkt"],
            "projection":r["source2015"]["projection_wkt"],
            "parametres":r["source2015"]["parametres_projection_wkt"],
            "difference_positions":comp,
          },ensure_ascii=False,indent=2))
          assert all(-60<x<-48 for x in r["source2015"]["centres_wgs84_plage_lons"])
          assert all(0<x<7 for x in r["source2015"]["centres_wgs84_plage_lats"])
          emprise=r["statistiques"]["emprise_collective_comparaison"]
          assert emprise["communes_comparees"]==22
          assert emprise["source2015_union_km2"]>0
          assert emprise["national2026_union_km2"]>0
          assert emprise["ecart_externe_symetrique_km2"]>=0
          assert emprise["ecart_externe_symetrique_km2"] <= (
            r["statistiques"]["ecart_cumule_des_comparaisons_par_code_km2"] + 0.001
          )
          print("CONTROLE PROJECTION GEOFLA",r["source2015"]["epsg_resolu"],
                r["source2015"]["crs_equivalent_epsg2972"],
                r["source2015"]["centres_wgs84_plage_lons"],
                r["source2015"]["centres_wgs84_plage_lats"])
          print("EMPRISES",json.dumps(emprise,ensure_ascii=False,indent=2))
          decomp=r["decomposition_ecarts_cartographiques"]
          assert decomp["statut"]=="DIFFERENCES_DE_CARTES_NON_JURIDIQUES"
          stats=decomp["decomposition_global_km2"]
          assert len(decomp["par_commune"])==22
          assert set(decomp["priorites"])=={"97301","97303","97312"}
          assert abs(stats["ecart_externe_total_km2"]-733.434981)<0.001
          assert abs(stats["somme_ecarts_communaux_km2"]-918.066563)<0.001
          assert abs(stats["ecart_externe_total_km2"]+
                     2*stats["ecart_interne_unique_km2"]-
                     stats["somme_ecarts_communaux_km2"])<0.001
          assert abs(stats["ecart_interne_compte_deux_fois_km2"]-
                     2*stats["ecart_interne_unique_km2"])<0.001
          assert all(abs(x["ecart_externe_total_km2"]+
                         x["ecart_interne_double_km2"]-
                         x["difference_symetrique_totale_km2"])<0.001
                     for x in decomp["par_commune"])
          print("DECOMPOSITION ECARTS",json.dumps(stats,ensure_ascii=False,indent=2))
          for code in ("97301","97312","97303"):
              row=next(x for x in decomp["par_commune"] if x["code"]==code)
              print("FOCUS",code,json.dumps({
                "surfaces":row,"voisinage":decomp["priorites"][code]
              },ensure_ascii=False,indent=2))

          assert r["publication_possible"] is False
          assert r["geometries_publiees"]==0
          assert r["contours_historiques_adoptes"]==0
          assert all("geometry" not in x and "coordinates" not in x for x in r["comparaisons_par_code"])
          print("RAPPORT GEOFLA",json.dumps(r["statistiques"],ensure_ascii=False,indent=2))
          PY
      - name: Archiver uniquement le rapport de source
        uses: actions/upload-artifact@v4
        with:
          name: adlfi-guyane-geofla-2015-controle-source-tierce
          path: ${{ runner.temp }}/rapport-geofla-guyane-2015.json
          retention-days: 30
          if-no-files-found: error
