name: Lieux — Mayotte, 17 communes COMER et DROM (historique)

on:
  pull_request:
    paths:
      - 'docs/data/lieux-mayotte/**'
      - 'docs/assets/lieux-mayotte-historique.js'
      - 'docs/assets/lieux-multiechelon.js'
      - 'docs/data/manifest.json'
      - 'docs/lieux/index.html'
      - 'scripts/verifier_index_public_mayotte_2026.py'
      - 'tests/test_lieux_mayotte_historique.js'
      - 'tests/test_lieux_ui.py'
      - '.github/workflows/lieux-mayotte-historique-2026.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mayotte-historique:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester les 34 épisodes et la non-équivalence Pactols de Dembeni
        run: |
          node tests/test_lieux_mayotte_historique.js
          python3 -m unittest discover -s tests -p 'test_lieux_ui.py' -v
      - name: Acquérir trois fichiers Insee COG 2026 épinglés
        run: python3 scripts/recuperer_cog_2026.py --sortie "$RUNNER_TEMP/cog2026"
      - name: Acquérir et contrôler l'historique officiel des subdivisions COMER
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://www.insee.fr/fr/statistiques/fichier/8740222/cog_ensemble_2026_csv.zip' \
            --output "$RUNNER_TEMP/cog_ensemble_2026_csv.zip"
          python3 - <<'PY'
          import hashlib,os,zipfile
          from pathlib import Path
          target=Path(os.environ["RUNNER_TEMP"])
          with zipfile.ZipFile(target/"cog_ensemble_2026_csv.zip") as z:
              matches=[x for x in z.infolist()
                       if Path(x.filename).name=="v_commune_outremer_depuis_1943.csv"]
              assert len(matches)==1,"Le fichier COMER historique doit être unique"
              item=matches[0]
              assert 2000<item.file_size<=5_000_000
              raw=z.read(item)
          checksum=hashlib.sha256(raw).hexdigest()
          assert checksum=="d2e2d3b376540d5c5e624e1cdf3d6a1959f6f24d6763268eec67883fe82ce748",checksum
          (target/"cog2026"/"v_commune_outremer_depuis_1943.csv").write_bytes(raw)
          print("COMER OFFICIEL MAYOTTE",len(raw),checksum)
          PY
      - name: Confronter les 34 épisodes publics aux deux fichiers historiques Insee
        run: |
          python3 scripts/verifier_index_public_mayotte_2026.py \
            --cog-dir "$RUNNER_TEMP/cog2026" \
            --public docs/data/lieux-mayotte/chronologie-cog-2026.json
      - name: Vérifier que les 16 alignements approuvés et Dembeni restent distincts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("docs/data/lieux-outremer/recherche-2026.json").read_text())
          public=json.loads(Path("docs/data/lieux-mayotte/chronologie-cog-2026.json").read_text())
          manifest=json.loads(Path("docs/data/manifest.json").read_text())["modules"]["lieux"]
          valid={k:v for k,v in data["pactols_valides"].items() if k.startswith("976")}
          assert len(data["pactols_valides"])==176
          assert len(valid)==16 and "97607" not in valid
          assert set(valid)=={f"976{i:02d}" for i in range(1,18)}-{"97607"}
          assert data["ark_confirmes_non_valides"]=={"97607":"26678/crtZcuFSJVYZU"}
          assert len(public["episodes"].splitlines())==34
          assert public["correspondances_pactols_COG_2026_conservees"]==16
          assert manifest["historique_communes_mayotte"]["total_episodes_COG"]==34
          assert manifest["recherche_cog_outremer_2026"]["relations_pactols_cog_validees_2026"]==176
          assert public["nouveaux_alignements_pactols"]==0
          assert public["contours_historiques_publies"]==0
          assert public["nouvelles_relations_successions_inferrees"]==0
          print("MAYOTTE : 17 COMER + 17 DROM, 16 liens 2026 validés, Dembeni réservé — OK")
          PY
