name: Lieux - publier en recette les 32 contours Nouvelle-Caledonie 2026
on:
  pull_request:
    paths:
      - 'scripts/preparer_contours_nouvelle_caledonie_2026.py'
      - 'tests/test_preparer_contours_nouvelle_caledonie_2026.py'
      - 'tests/test_lieux_nc_contours_2026.js'
      - 'tests/test_lieux_nc_contours_navigateur.py'
      - 'docs/assets/lieux-nc-contours.js'
      - 'docs/assets/lieux-multiechelon.js'
      - 'docs/lieux/index.html'
      - 'docs/data/lieux-outremer/contours-communes-nc-2026.geojson'
      - '.github/workflows/lieux-nc-32-contours-2026.yml'
permissions:
  contents: write
jobs:
  publier-nc:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check shapely==2.0.7 pytest
      - run: python3 -m pytest -q tests/test_preparer_contours_nouvelle_caledonie_2026.py
      - name: Télécharger et vérifier l'édition Etalab 2026
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 120 \
            'https://etalab-datasets.geo.data.gouv.fr/contours-administratifs/2026/geojson/communes-100m.geojson.gz' \
            -o "$RUNNER_TEMP/communes-2026.geojson.gz"
          echo "4530cbf87a3af387c2da95935376f74b93eabd0a7595eacc5b7e0ed94a0b3778  $RUNNER_TEMP/communes-2026.geojson.gz" | sha256sum -c -
      - name: Extraire deux fois et contrôler l'identité octet à octet
        run: |
          set -euo pipefail
          for n in 1 2; do
            python3 scripts/preparer_contours_nouvelle_caledonie_2026.py \
              --geometries "$RUNNER_TEMP/communes-2026.geojson.gz" \
              --index-cog docs/data/lieux-outremer/recherche-2026.json \
              --sortie "$RUNNER_TEMP/nc-32-$n.geojson"
          done
          cmp "$RUNNER_TEMP/nc-32-1.geojson" "$RUNNER_TEMP/nc-32-2.geojson"
          cp "$RUNNER_TEMP/nc-32-1.geojson" docs/data/lieux-outremer/contours-communes-nc-2026.geojson
      - name: Tests de provenance et non-régressions
        run: |
          set -euo pipefail
          node tests/test_lieux_nc_contours_2026.js
          node tests/test_lieux_spm_contours_2026.js
          node tests/test_lieux_drom_contours_2026.js
          node tests/test_lieux_corse_pactols_2026.js
          node tests/test_lieux_bfc_pactols_2026.js
          node tests/test_lieux_pdl_pactols_2026.js
      - name: Installer Chromium
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.58.0
          python3 -m playwright install chromium
      - name: Contrôler les fiches en navigation réelle
        run: |
          set -euo pipefail
          python3 tests/test_lieux_nc_contours_navigateur.py
          python3 tests/test_lieux_spm_contours_navigateur.py
          python3 tests/test_lieux_drom_contours_navigateur.py
          python3 tests/test_lieux_corse_pactols_navigateur.py
          python3 tests/test_lieux_bfc_pactols_navigateur.py
          python3 tests/test_lieux_pdl_pactols_navigateur.py
      - uses: actions/upload-artifact@v4
        with:
          name: contours-nc-32-2026-recette
          path: ${{ runner.temp }}/nc-32-1.geojson
          retention-days: 30
          if-no-files-found: error
      - name: Versionner le fichier dans la branche de PR uniquement après recette
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add -- docs/data/lieux-outremer/contours-communes-nc-2026.geojson
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Lieux : versionner les 32 contours NC 2026 contrôlés'
            git fetch origin "$HEAD_REF"
            git rebase "origin/$HEAD_REF"
            git push origin "HEAD:$HEAD_REF"
          else
            echo "GeoJSON NC déjà conforme à la source épinglée"
          fi
