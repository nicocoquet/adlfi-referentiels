name: Lieux — Normandie lot 01, identités historiques

on:
  pull_request:
    paths:
      - 'scripts/auditer_normandie_lot01_identites_2026.py'
      - 'tests/test_auditer_normandie_lot01_identites_2026.py'
      - 'recette/lieux/NORMANDIE-LOT01-IDENTITES-2026.md'
      - '.github/workflows/lieux-normandie-lot01-identites-2026.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dix-identites:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: referentiels
      - uses: actions/checkout@v4
        with:
          repository: frantiq/PACTOLS
          ref: 69bf9697e24cefd645a69465bbd271702786285a
          path: pactols
          lfs: true
          sparse-checkout: |
            pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester les dix dossiers et la non-promotion des anciens ARK
        working-directory: referentiels
        run: python3 -m unittest discover -s tests -p 'test_auditer_normandie_lot01_identites_2026.py' -v
      - name: Vérifier le RDF Pactols figé
        run: |
          echo '3a0effe42a27da20c30497a6847fc1becbb736745945f01e4321b4791f0067c7  pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf' | sha256sum -c -
      - name: Produire deux audits indépendants des dix codes
        working-directory: referentiels
        run: |
          set -euo pipefail
          for n in 1 2; do
            python3 scripts/auditer_normandie_lot01_identites_2026.py \
              --rdf ../pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf \
              --sortie "$RUNNER_TEMP/normandie-lot01-$n.json"
          done
          cmp "$RUNNER_TEMP/normandie-lot01-1.json" "$RUNNER_TEMP/normandie-lot01-2.json"
          python3 - "$RUNNER_TEMP/normandie-lot01-1.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf8'))
          b=d['bilan']
          assert b['dossiers']==10 and b['candidats_Pactols']==19
          assert b['codes_avec_candidat_distinct_commune_actuelle']==9
          assert b['codes_sans_arbitrage_identite_actuelle']==1
          assert b['nouvelles_validations_publiees']==0
          assert b['limites_historiques_inferrees']==0
          assert all(x['decision_editoriale']=='NON_PRISE' for x in d['dossiers'])
          print("NORMANDIE_LOT01_PREUVE",json.dumps(b,ensure_ascii=False,sort_keys=True))
          for x in d['dossiers']:
            print("NORMANDIE_DOSSIER",json.dumps({
                "code":x['code_COG_2026'],"nom":x['nom_COG_2026'],
                "statut":x['statut'],
                "ark_qualifications":[{"ark":y['ark'],"classe":y['classification'],
                  "notes":y['notes']} for y in x['candidats_Pactols']]
              },ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: normandie-lot01-rdf-identites-2026
          path: ${{ runner.temp }}/normandie-lot01-1.json
          retention-days: 30
          if-no-files-found: error
