name: Lieux — Normandie lot 01, neuf validations 2026

on:
  pull_request:
    paths:
      - 'scripts/valider_normandie_lot01_pactols_2026.py'
      - 'tests/test_valider_normandie_lot01_pactols_2026.py'
      - 'docs/data/lieux-chronologie/pactols-normandie-lot01-2026.json'
      - '.github/workflows/lieux-normandie-lot01-validation-2026.yml'
      - 'recette/lieux/NORMANDIE-LOT01-VALIDATIONS-2026.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neuf-validations:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: referentiels
      - uses: actions/checkout@v4
        with:
          repository: frantiq/PACTOLS
          ref: 69bf9697e24cefd645a69465bbd271702786285a
          path: pactols
          lfs: true
          sparse-checkout: |
            pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests de la séparation entre communes nouvelles et anciennes
        working-directory: referentiels
        run: python3 -m unittest discover -s tests -p 'test_valider_normandie_lot01_pactols_2026.py' -v
      - name: Contrôler le RDF public épinglé
        run: |
          echo '3a0effe42a27da20c30497a6847fc1becbb736745945f01e4321b4791f0067c7  pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf' | sha256sum -c -
      - name: Recalculer deux fois les neuf validations et comparer au registre versionné
        working-directory: referentiels
        run: |
          set -euo pipefail
          for n in 1 2; do
            python3 scripts/valider_normandie_lot01_pactols_2026.py \
              --rdf ../pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf \
              --comparer docs/data/lieux-chronologie/pactols-normandie-lot01-2026.json \
              --sortie "$RUNNER_TEMP/normandie-neuf-validations-$n.json"
          done
          cmp "$RUNNER_TEMP/normandie-neuf-validations-1.json" "$RUNNER_TEMP/normandie-neuf-validations-2.json"
          python3 - "$RUNNER_TEMP/normandie-neuf-validations-1.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['schema']=='adlfi.lieux.pactols.normandie.lot01.2026.public.v1'
          assert d['nombre_communes']==9
          assert d['communes_lot01_a_instruire']==1
          assert d['couverture_region_entiere'] is False
          assert d['active_dans_interface'] is False
          assert d['nouvelles_geometries']==0
          assert d['liens_historiques_inferes']==0
          assert '50412' not in [r['code_insee'] for r in d['alignements_Pactols_COG_valides_2026']]
          print('NORMANDIE_NEUF_VALIDATIONS_OK',sorted(r['code_insee'] for r in d['alignements_Pactols_COG_valides_2026']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: normandie-neuf-validations-pactols-cog-2026
          path: ${{ runner.temp }}/normandie-neuf-validations-1.json
          retention-days: 30
          if-no-files-found: error
