name: Lieux — Normandie lot 02, qualification de vingt ARK

on:
  pull_request:
    paths:
      - 'scripts/auditer_normandie_lot02_rdf_2026.py'
      - 'tests/test_auditer_normandie_lot02_rdf_2026.py'
      - '.github/workflows/lieux-normandie-lot02-rdf-2026.yml'
      - 'recette/lieux/NORMANDIE-LOT02-RDF-2026.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lot02:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: referentiels
      - uses: actions/checkout@v4
        with:
          repository: frantiq/PACTOLS
          ref: 69bf9697e24cefd645a69465bbd271702786285a
          path: pactols
          lfs: true
          sparse-checkout: |
            pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests du contrat historique, sans validation automatique
        working-directory: referentiels
        run: python3 -m unittest discover -s tests -p 'test_auditer_normandie_lot02_rdf_2026.py' -v
      - name: Empreinte du RDF Pactols publié
        run: |
          echo '3a0effe42a27da20c30497a6847fc1becbb736745945f01e4321b4791f0067c7  pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf' | sha256sum -c -
      - name: Deux analyses identiques, conservation des notes RDF
        working-directory: referentiels
        run: |
          set -euo pipefail
          for n in 1 2; do
            python3 scripts/auditer_normandie_lot02_rdf_2026.py \
              --rdf ../pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf \
              --sortie "$RUNNER_TEMP/normandie-lot02-$n.json"
          done
          cmp "$RUNNER_TEMP/normandie-lot02-1.json" "$RUNNER_TEMP/normandie-lot02-2.json"
          python3 - "$RUNNER_TEMP/normandie-lot02-1.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf8'))
          b=r['bilan']
          assert b['communes_COG_a_instruire']==10 and b['ARK_candidats']==20
          assert b['nouvelles_validations']==0
          assert b['nouvelles_geometries']==0
          assert b['liens_historiques_inferes']==0
          assert all(x['decision_editoriale']=='NON_PRISE' for x in r['dossiers'])
          print('NORMANDIE_LOT02_PREUVE',json.dumps(b,ensure_ascii=False,sort_keys=True))
          for x in r['dossiers']:
            print('NORMANDIE_LOT02_DOSSIER',json.dumps({
              'code':x['code_COG_2026'],'nom':x['nom_COG_2026'],
              'ARK':[{'ark':c['ark'],'pref':c['prefLabels_fr'],
                 'notes':c['notes'],'classe':c['role_preliminaire']}
                 for c in x['candidats_Pactols']]
            },ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: normandie-lot02-vingt-ark-rdf-2026
          path: ${{ runner.temp }}/normandie-lot02-1.json
          retention-days: 30
          if-no-files-found: error
