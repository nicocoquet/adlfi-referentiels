name: Lieux — Nouvelle-Calédonie 33 communes COG et provinces Poya

on:
  pull_request:
    paths:
      - 'scripts/auditer_cog_nouvelle_caledonie_2026.py'
      - 'tests/test_auditer_cog_nouvelle_caledonie_2026.py'
      - 'recette/lieux/NOUVELLE-CALEDONIE-COG-HISTORIQUE-2026-RECETTE.md'
      - '.github/workflows/lieux-nouvelle-caledonie-cog-2026.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-988:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester distinction communes/provinces/aires coutumières
        run: python3 -m unittest discover -s tests -p 'test_auditer_cog_nouvelle_caledonie_2026.py' -v
      - name: Télécharger et vérifier les 6 CSV officiels COG Insee 2026
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://www.insee.fr/fr/statistiques/fichier/8740222/cog_ensemble_2026_csv.zip' \
            --output "$RUNNER_TEMP/cog_ensemble_2026_csv.zip"
          python3 - <<'PY'
          import os,hashlib,zipfile,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from auditer_cog_polynesie_2026 import SHAS
          p=Path(os.environ['RUNNER_TEMP']);out=p/'cog2026';out.mkdir()
          with zipfile.ZipFile(p/'cog_ensemble_2026_csv.zip') as z:
            for name,digest in SHAS.items():
              files=[x for x in z.infolist() if Path(x.filename).name==name]
              assert len(files)==1,name
              data=z.read(files[0]);sha=hashlib.sha256(data).hexdigest()
              assert sha==digest,(name,sha)
              (out/name).write_bytes(data)
              print('COG_NOUVELLE_CALEDONIE_SHA',name,sha)
          PY
      - name: Certifier 33 codes COG et inspecter tous les épisodes depuis 1943
        run: |
          for n in 1 2; do
            python3 scripts/auditer_cog_nouvelle_caledonie_2026.py \
              --sources "$RUNNER_TEMP/cog2026" \
              --index-public docs/data/lieux-outremer/recherche-2026.json \
              --sortie "$RUNNER_TEMP/nouvelle-caledonie-$n.json" \
              > "$RUNNER_TEMP/resume-nc-$n.txt"
          done
          cmp "$RUNNER_TEMP/nouvelle-caledonie-1.json" "$RUNNER_TEMP/nouvelle-caledonie-2.json"
          cat "$RUNNER_TEMP/resume-nc-1.txt"
      - name: Valider les exclusions et isoler Poya, Kouaoua et Canala
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'nouvelle-caledonie-1.json').read_text())
          assert d['schema']=='adlfi.lieux.nouvelle-caledonie.audit.cog2026.v1'
          assert d['statut']=='RECETTE_COG_NON_VALIDANTE'
          assert d['bilan']['communes_2026']==33
          assert d['bilan']['episodes_communes_existantes']==33
          assert d['bilan']['anciens_codes_ou_zonages']==0
          assert d['debut_episodes_par_date_COG']=={
            '1969-03-30':32,'1995-04-25':1}
          by={e['code']:e for e in d['episodes_communes_COG']}
          assert by['98833']['libelle']=='Kouaoua'
          assert by['98833']['debut_inclus']=='1995-04-25'
          assert by['98804']['libelle']=='Canala'
          assert by['98804']['debut_inclus']=='1969-03-30'
          assert d['Poya']['code_COG']=='98827'
          assert len(d['communes_COG_2026'])==33
          assert len({x['code'] for x in d['communes_COG_2026']})==33
          assert d['Poya']['libelle']=='Poya'
          assert d['Poya']['provinces_juridiques']==['Nord','Sud']
          assert d['Poya']['code_COG_province_unique'] is None
          assert d['bilan']['communes_Poya_a_double_province']==1
          assert d['provinces']['nombre']==3
          assert d['aires_coutumieres']['nombre']==8
          assert d['bilan']['nouveaux_ARK']==0
          assert d['bilan']['nouveaux_contours']==0
          assert d['bilan']['publication_docs'] is False
          assert d['bilan']['rattachements_provinces_deduits']==0
          assert d['bilan']['aires_coutumieres_deduites_des_communes']==0
          print('NOUVELLE_CALEDONIE_CONTRATS',d['Poya'],d['bilan'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adlfi-nouvelle-caledonie-cog2026-33-communes-preinstruction
          path: ${{ runner.temp }}/nouvelle-caledonie-1.json
          retention-days: 30
          if-no-files-found: error
