name: Lieux - PACA audit Abriès-Ristolas RDF
on:
  pull_request:
    paths:
      - 'scripts/auditer_paca_abries_ristolas_2026.py'
      - 'tests/test_auditer_paca_abries_ristolas_2026.py'
      - '.github/workflows/lieux-paca-abries-ristolas-audit-2026.yml'
permissions:
  contents: write
jobs:
  auditer:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: referentiels
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: frantiq/PACTOLS
          ref: 69bf9697e24cefd645a69465bbd271702786285a
          path: pactols
          lfs: true
          sparse-checkout: |
            pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests de la distinction administrative et ontologique
        working-directory: referentiels
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_auditer_paca_abries_ristolas_2026.py' -v
      - name: Vérifier l'instantané Pactols épinglé
        run: |
          set -euo pipefail
          echo '3a0effe42a27da20c30497a6847fc1becbb736745945f01e4321b4791f0067c7  pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf' | sha256sum -c -
      - name: Deux analyses identiques du RDF et du COG
        working-directory: referentiels
        run: |
          set -euo pipefail
          for n in 1 2; do
            python3 scripts/auditer_paca_abries_ristolas_2026.py \
              --rdf ../pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf \
              --cog docs/data/lieux-chronologie/cog-paca.json \
              --publie docs/data/lieux-chronologie/pactols-paca-communes-nouvelles-2026.json \
              --sortie "$RUNNER_TEMP/PACA-ABRIES-RISTOLAS-$n.json"
          done
          cmp "$RUNNER_TEMP/PACA-ABRIES-RISTOLAS-1.json" "$RUNNER_TEMP/PACA-ABRIES-RISTOLAS-2.json"
          python3 - "$RUNNER_TEMP/PACA-ABRIES-RISTOLAS-1.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['schema']=='adlfi.lieux.paca.abries_ristolas.2026.audit.v1'
          assert d['bilan']['concepts_RDF_examines']==50556
          assert d['bilan']['prefLabel_actuel_unique'] is True
          assert d['bilan']['ancienne_commune_ARK_distincte'] is True
          assert d['bilan']['exactMatch_INSEE_nouveau']==0
          assert d['bilan']['nouveaux_ARK_valides']==0
          assert d['bilan']['communes_PACA_alignees_avant']==945
          assert d['rdf']['concept_actuel']['ark_pactols']=='26678/pcrtm96gvvfnwmggc9z0wrxn'
          assert d['rdf']['concept_ancienne_commune']['ark_pactols']=='26678/pcrtGQ7nGPZN7K'
          print('PACA_ABRIES_RISTOLAS_NON_VALIDANT_OK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lieux-paca-abries-ristolas-rdf-2026
          path: ${{ runner.temp }}/PACA-ABRIES-RISTOLAS-1.json
          retention-days: 30
          if-no-files-found: error
      - name: Versionner le rapport de recette (jamais docs)
        working-directory: referentiels
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/PACA-ABRIES-RISTOLAS-1.json" recette/lieux/PACA-ABRIES-RISTOLAS-AUDIT-2026.json
          git add -- recette/lieux/PACA-ABRIES-RISTOLAS-AUDIT-2026.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Lieux PACA : conserver la qualification RDF d’Abriès-Ristolas'
            git fetch origin "$HEAD_REF"
            git rebase "origin/$HEAD_REF"
            git push origin "HEAD:$HEAD_REF"
          fi
