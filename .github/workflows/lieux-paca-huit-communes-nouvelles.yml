name: Lieux - PACA huit communes nouvelles Pactols et COG 2026
on:
  pull_request:
    paths:
      - 'scripts/auditer_paca_huit_communes_nouvelles_2026.py'
      - 'tests/test_auditer_paca_huit_communes_nouvelles_2026.py'
      - '.github/workflows/lieux-paca-huit-communes-nouvelles.yml'
permissions:
  contents: write
jobs:
  audit-fusions:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: referentiels
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: frantiq/PACTOLS
          ref: 69bf9697e24cefd645a69465bbd271702786285a
          path: pactols
          lfs: true
          sparse-checkout: |
            pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester les huit fusions et la qualification des labels
        working-directory: referentiels
        run: python3 -m unittest discover -s tests -p 'test_auditer_paca_huit_communes_nouvelles_2026.py' -v
      - name: Contrôler le SHA-256 du RDF Pactols figé
        run: |
          set -euo pipefail
          echo '3a0effe42a27da20c30497a6847fc1becbb736745945f01e4321b4791f0067c7  pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf' | sha256sum -c -
      - name: Auditer deux fois les huit communes nouvelles et leurs ARK
        working-directory: referentiels
        run: |
          set -euo pipefail
          for n in 1 2; do
            python3 scripts/auditer_paca_huit_communes_nouvelles_2026.py \
              --rdf ../pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf \
              --cog docs/data/lieux-chronologie/cog-paca.json \
              --preflight recette/lieux/PACA-PREFLIGHT-EXACTMATCH-2026.json \
              --sortie "$RUNNER_TEMP/paca-huit-communes-nouvelles-$n.json"
          done
          cmp "$RUNNER_TEMP/paca-huit-communes-nouvelles-1.json" "$RUNNER_TEMP/paca-huit-communes-nouvelles-2.json"
          python3 - "$RUNNER_TEMP/paca-huit-communes-nouvelles-1.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['bilan']['communes_nouvelles_a_instruire']==8
          assert d['bilan']['ARK_vers_codes_contemporains']==15
          assert d['bilan']['nouvelles_validations_2026']==0
          assert d['bilan']['etats_historiques_inferes']==0
          assert d['bilan']['geometries_modifiees']==0
          assert {x['code_COG_2026'] for x in d['dossiers']}=={
              '04033','04120','05001','05024','05039','05053','05101','05118'}
          print('PACA_HUIT_FUSIONS_AUDIT_OK',d['bilan'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lieux-paca-huit-fusions-ark-rdf-2026
          path: ${{ runner.temp }}/paca-huit-communes-nouvelles-1.json
          retention-days: 30
          if-no-files-found: error
      - name: Versionner les conclusions uniquement dans la recette
        working-directory: referentiels
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/paca-huit-communes-nouvelles-1.json" \
            recette/lieux/PACA-HUIT-COMMUNES-NOUVELLES-RDF-2026.json
          git add -- recette/lieux/PACA-HUIT-COMMUNES-NOUVELLES-RDF-2026.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Lieux PACA : archiver les preuves des huit fusions et des candidats RDF'
            git fetch origin "$HEAD_REF"
            git rebase "origin/$HEAD_REF"
            git push origin "HEAD:$HEAD_REF"
          fi
