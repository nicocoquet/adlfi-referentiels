name: Lieux - PACA trois renommages COG et RDF Pactols
on:
  pull_request:
    paths:
      - 'scripts/auditer_paca_trois_renommages_rdf_2026.py'
      - 'tests/test_auditer_paca_trois_renommages_rdf_2026.py'
      - '.github/workflows/lieux-paca-trois-renommages-rdf-2026.yml'
permissions:
  contents: write
jobs:
  audit-sans-publication:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: referentiels
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: frantiq/PACTOLS
          ref: 69bf9697e24cefd645a69465bbd271702786285a
          path: pactols
          lfs: true
          sparse-checkout: |
            pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester la séparation COG, Pactols et homonymes
        working-directory: referentiels
        run: python3 -m unittest discover -s tests -p 'test_auditer_paca_trois_renommages_rdf_2026.py' -v
      - name: Vérifier la source RDF figée
        run: |
          set -euo pipefail
          echo '3a0effe42a27da20c30497a6847fc1becbb736745945f01e4321b4791f0067c7  pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf' | sha256sum -c -
      - name: Produire deux audits de trois renommages identiques
        working-directory: referentiels
        run: |
          set -euo pipefail
          for n in 1 2; do
            python3 scripts/auditer_paca_trois_renommages_rdf_2026.py \
              --rdf ../pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf \
              --cog docs/data/lieux-chronologie/cog-paca.json \
              --sortie "$RUNNER_TEMP/paca-trois-renommages-$n.json"
          done
          cmp "$RUNNER_TEMP/paca-trois-renommages-1.json" "$RUNNER_TEMP/paca-trois-renommages-2.json"
          python3 - "$RUNNER_TEMP/paca-trois-renommages-1.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1],encoding='utf-8'))
          assert [r['code_COG'] for r in a['dossiers']]==['04045','05127','83052']
          assert a['bilan']['ARK_directs_vers_codes_2026']==2
          assert a['bilan']['nouveaux_ARK_valides']==0
          assert not a['bilan']['index_public_modifie']
          assert all(r['qualification']=='COG_RENOMMAGE_CONFIRME_PACTOLS_A_INSTRUIRE' for r in a['dossiers'])
          print('PACA_TROIS_RENOMMAGES_SANS_VALIDATION_OK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lieux-paca-trois-renommages-rdf-2026
          path: ${{ runner.temp }}/paca-trois-renommages-1.json
          retention-days: 30
          if-no-files-found: error
      - name: Versionner le rapport de recette uniquement après tests
        working-directory: referentiels
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/paca-trois-renommages-1.json" recette/lieux/PACA-TROIS-RENOMMAGES-RDF-2026.json
          git add -- recette/lieux/PACA-TROIS-RENOMMAGES-RDF-2026.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Lieux PACA : documenter trois renommages COG et les concepts Pactols'
            git fetch origin "$HEAD_REF"
            git rebase "origin/$HEAD_REF"
            git push origin "HEAD:$HEAD_REF"
          fi
