name: Lieux — préparer 1 140 validations Pactols PDL 2026

on:
  pull_request:
    paths:
      - 'scripts/preparer_validations_pactols_pdl_2026.py'
      - 'tests/test_preparer_validations_pactols_pdl_2026.py'
      - 'recette/lieux/PDL-1140-VALIDATIONS-PACTOLS-COG-2026.md'
      - '.github/workflows/lieux-pdl-1140-validations-2026.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparer-1140:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: referentiels
      - uses: actions/checkout@v4
        with:
          repository: frantiq/PACTOLS
          ref: 69bf9697e24cefd645a69465bbd271702786285a
          path: pactols
          lfs: true
          sparse-checkout: |
            pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests d'unicité et de contrôle exhaustif des URI INSEE
        working-directory: referentiels
        run: |
          python3 -m unittest discover -s tests -p 'test_preparer_validations_pactols_pdl_2026.py' -v
          python3 -m unittest discover -s tests -p 'test_auditer_pactols_cog_regions_prioritaires_2026.py' -v
      - name: Vérifier la source RDF Pactols
        run: |
          echo '3a0effe42a27da20c30497a6847fc1becbb736745945f01e4321b4791f0067c7  pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf' | sha256sum --check
      - name: Acquérir le COG Insee 2026
        working-directory: referentiels
        run: python3 scripts/recuperer_cog_2026.py --sortie "$RUNNER_TEMP/cog2026"
      - name: Deux registres et deux listes d'exceptions identiques
        working-directory: referentiels
        run: |
          set -euo pipefail
          for n in 1 2; do
            python3 scripts/preparer_validations_pactols_pdl_2026.py \
              --rdf ../pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf \
              --cog "$RUNNER_TEMP/cog2026/v_commune_2026.csv" \
              --sortie-csv "$RUNNER_TEMP/pdl-validations-$n.csv" \
              --sortie-exceptions "$RUNNER_TEMP/pdl-exceptions-$n.json"
          done
          cmp "$RUNNER_TEMP/pdl-validations-1.csv" "$RUNNER_TEMP/pdl-validations-2.csv"
          cmp "$RUNNER_TEMP/pdl-exceptions-1.json" "$RUNNER_TEMP/pdl-exceptions-2.json"
          python3 - "$RUNNER_TEMP/pdl-validations-1.csv" "$RUNNER_TEMP/pdl-exceptions-1.json" <<'PY'
          import csv,json,sys
          with open(sys.argv[1],newline="",encoding="utf-8") as f:
              rows=list(csv.DictReader(f,delimiter=";"))
          exc=json.load(open(sys.argv[2],encoding="utf-8"))
          assert len(rows)==1140
          assert len(exc["exceptions"])==88
          assert exc["statuts"]=={
              "ELIGIBLE_SELON_REGLE":1140,
              "A_INSTRUIRE_PLUSIEURS_ARK":60,
              "A_INSTRUIRE_LIBELLE_STATUT_OU_URI":24,
              "SANS_EXACTMATCH":4,
          }
          assert all(x["statut_validation"]=="VALIDE_ADLFI_2026" for x in rows)
          assert all(x["publication_site"]=="EN_ATTENTE_RECETTE_PUBLICATION" for x in rows)
          assert len(set(x["ark_pactols"] for x in rows))==1140
          assert len(set(x["code_insee"] for x in rows))==1140
          assert all(x["decision_editoriale"]=="NON_PRISE" for x in exc["exceptions"])
          assert {x["code_insee"] for x in exc["exceptions"] if x["etat_a_instruire"]=="SANS_EXACTMATCH"}=={"44066","85165","85212","85292"}
          assert exc["publication"]=="NON_PUBLIE"
          assert exc["liens_historiques_inferes"]==0
          print("PDL_1140_CONTROLE_OK",json.dumps({
              "records":len(rows),"exceptions":len(exc["exceptions"]),
              "source_rdf":exc["pactols_sha256"],"source_cog":exc["cog_sha256"],
              "publication":exc["publication"]},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recette-pdl-1140-pactols-cog-2026
          path: |
            ${{ runner.temp }}/pdl-validations-1.csv
            ${{ runner.temp }}/pdl-exceptions-1.json
          retention-days: 30
          if-no-files-found: error
