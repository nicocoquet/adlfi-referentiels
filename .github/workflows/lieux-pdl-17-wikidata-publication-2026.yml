name: Lieux PDL — 17 correspondances Wikidata P374 (1212)
on:
  pull_request:
    paths:
      - 'scripts/publier_pdl_17_wikidata_p374_2026.py'
      - 'recette/lieux/PDL-17-WIKIDATA-P374-PUBLICATION-2026.md'
      - 'docs/data/lieux-chronologie/pactols-pdl-wikidata-p374-2026.json'
      - 'docs/assets/lieux-pdl-wikidata-p374.js'
      - 'docs/assets/lieux-multiechelon.js'
      - 'docs/lieux/index.html'
      - 'docs/data/manifest.json'
      - 'tests/test_lieux_ui.py'
      - 'tests/test_publier_pdl_17_wikidata_p374_2026.py'
      - 'tests/test_lieux_pdl_17_wikidata_p374_2026.js'
      - 'tests/test_lieux_pdl_17_wikidata_p374_navigateur.py'
      - '.github/workflows/lieux-pdl-17-wikidata-publication-2026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publier:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: referentiels
      - uses: actions/checkout@v4
        with:
          repository: frantiq/PACTOLS
          ref: 69bf9697e24cefd645a69465bbd271702786285a
          path: pactols
          lfs: true
          sparse-checkout: |
            pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier la source RDF et les 17 preuves Wikidata figées
        working-directory: referentiels
        run: |
          set -euo pipefail
          echo '3a0effe42a27da20c30497a6847fc1becbb736745945f01e4321b4791f0067c7  ../pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf' | sha256sum --check
          python3 -m unittest discover -s tests -p 'test_croiser_pdl_17_wikidata_p374_2026.py' -v
          python3 -m unittest discover -s tests -p 'test_prequalifier_pdl_17_sans_insee_2026.py' -v
      - name: Deux reproductions du JSON depuis Pactols, COG et les révisions Wikidata
        working-directory: referentiels
        run: |
          set -euo pipefail
          for n in 1 2; do
            python3 scripts/publier_pdl_17_wikidata_p374_2026.py \
              --rdf ../pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf \
              --cog docs/data/lieux-chronologie/cog-pdl.json \
              --qualif recette/lieux/PDL-17-WIKIDATA-P374-2026.json \
              --origine recette/lieux/PDL-24-DIVERGENCES-NOMINATIF-2026.json \
              --base docs/data/lieux-chronologie/pactols-pdl-2026.json \
              --uuid docs/data/lieux-chronologie/pactols-pdl-uuid-resolus-2026.json \
              --lot01 docs/data/lieux-chronologie/pactols-pdl-communes-nouvelles-lot01-2026.json \
              --chemille docs/data/lieux-chronologie/pactols-pdl-chemille-2026.json \
              --lot02 docs/data/lieux-chronologie/pactols-pdl-communes-nouvelles-lot02-2026.json \
              --oree docs/data/lieux-chronologie/pactols-pdl-oree-anjou-mod50-2026.json \
              --sortie "$RUNNER_TEMP/pdl-wikidata-1212-$n.json"
          done
          cmp "$RUNNER_TEMP/pdl-wikidata-1212-1.json" "$RUNNER_TEMP/pdl-wikidata-1212-2.json"
          cmp "$RUNNER_TEMP/pdl-wikidata-1212-1.json" docs/data/lieux-chronologie/pactols-pdl-wikidata-p374-2026.json
      - name: Tests Python, Node et non-régressions de toutes les régions
        working-directory: referentiels
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_publier_pdl_17_wikidata_p374_2026.py' -v
          python3 -m unittest discover -s tests -p 'test_lieux_ui.py' -v
          node tests/test_lieux_pdl_17_wikidata_p374_2026.js
          node tests/test_lieux_pdl_oree_mod50_2026.js
          node tests/test_lieux_pdl_lot02_45_2026.js
          node tests/test_lieux_pdl_chemille_2026.js
          node tests/test_lieux_pdl_lot01_cinq_ark_2026.js
          node tests/test_lieux_pdl_trois_uuid_resolus_2026.js
          node tests/test_lieux_pdl_pactols_2026.js
          node tests/test_lieux_paca_sept_communes_nouvelles_2026.js
          node tests/test_lieux_corse_pactols_2026.js
          node tests/test_lieux_bfc_pactols_2026.js
          node tests/test_lieux_drom_contours_2026.js
          node tests/test_lieux_spm_contours_2026.js
      - name: Installer Chromium
        working-directory: referentiels
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.58.0
          python3 -m playwright install chromium
      - name: Vérifier les fiches PDL et les non-régressions Chromium
        working-directory: referentiels
        run: |
          set -euo pipefail
          python3 tests/test_lieux_pdl_17_wikidata_p374_navigateur.py
          python3 tests/test_lieux_pdl_oree_mod50_navigateur.py
          python3 tests/test_lieux_pdl_lot02_45_navigateur.py
          python3 tests/test_lieux_pdl_chemille_navigateur.py
          python3 tests/test_lieux_pdl_lot01_cinq_ark_navigateur.py
          python3 tests/test_lieux_corse_pactols_navigateur.py
          python3 tests/test_lieux_bfc_pactols_navigateur.py
      - uses: actions/upload-artifact@v4
        with:
          name: preuve-pdl-17-wikidata-p374-1212
          path: ${{ runner.temp }}/pdl-wikidata-1212-1.json
          retention-days: 30
          if-no-files-found: error
