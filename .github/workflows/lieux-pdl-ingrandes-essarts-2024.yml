name: Lieux PDL — Ingrandes et Essarts : événements 2024 MOD32/MOD21
on:
  pull_request:
    paths:
      - 'scripts/auditer_pdl_ingrandes_essarts_2024.py'
      - 'tests/test_auditer_pdl_ingrandes_essarts_2024.py'
      - 'recette/lieux/PDL-INGRANDES-ESSARTS-2024.md'
      - '.github/workflows/lieux-pdl-ingrandes-essarts-2024.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditer:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: referentiels
      - uses: actions/checkout@v4
        with:
          repository: frantiq/PACTOLS
          ref: 69bf9697e24cefd645a69465bbd271702786285a
          path: pactols
          lfs: true
          sparse-checkout: |
            pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier le RDF Pactols th17 et les 1215 alignements existants
        working-directory: referentiels
        run: |
          set -euo pipefail
          echo '3a0effe42a27da20c30497a6847fc1becbb736745945f01e4321b4791f0067c7  ../pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf' | sha256sum --check
          python3 -m unittest discover -s tests -p 'test_auditer_pdl_ingrandes_essarts_2024.py' -v
      - name: Reproduire deux rapports identiques et vérifier l'absence de publication
        working-directory: referentiels
        run: |
          set -euo pipefail
          for n in 1 2; do
            python3 scripts/auditer_pdl_ingrandes_essarts_2024.py \
              --rdf ../pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf \
              --cog docs/data/lieux-chronologie/cog-pdl.json \
              --publications-dir docs/data/lieux-chronologie \
              --sortie "$RUNNER_TEMP/pdl-2024-$n.json"
          done
          cmp "$RUNNER_TEMP/pdl-2024-1.json" "$RUNNER_TEMP/pdl-2024-2.json"
          python3 - "$RUNNER_TEMP/pdl-2024-1.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["nombre_dossiers"]==len(d["dossiers"])==2
          assert {x["code"] for x in d["dossiers"]}=={"49160","85084"}
          assert {x["mod_cog"] for x in d["dossiers"]}=={"32","21"}
          assert d["couverture_PDL_publique"]==1215 and d["exceptions_PDL"]==13
          assert d["nouvelles_validations"]==d["geometries_nouvelles"]==d["liens_historiques_inferes"]==0
          assert all(x["publication"]=="NON_PUBLIE" and x["decision_editoriale"]=="NON_PRISE" for x in d["dossiers"])
          print("PDL_2024_AUDIT_REPRODUCTIBLE_SANS_PUBLICATION")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pdl-2024-ingrandes-essarts-preuves
          path: ${{ runner.temp }}/pdl-2024-1.json
          retention-days: 30
          if-no-files-found: error
