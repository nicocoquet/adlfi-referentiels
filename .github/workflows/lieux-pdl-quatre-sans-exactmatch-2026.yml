name: Lieux - PDL quatre codes sans exactMatch Insee
on:
  pull_request:
    paths:
      - 'scripts/auditer_pdl_quatre_sans_exactmatch_2026.py'
      - 'tests/test_auditer_pdl_quatre_sans_exactmatch_2026.py'
      - '.github/workflows/lieux-pdl-quatre-sans-exactmatch-2026.yml'
permissions:
  contents: write
jobs:
  auditer-4:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: referentiels
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: frantiq/PACTOLS
          ref: 69bf9697e24cefd645a69465bbd271702786285a
          path: pactols
          lfs: true
          sparse-checkout: |
            pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester les quatre transitions COG et le respect des 1140 liens
        working-directory: referentiels
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_auditer_pdl_quatre_sans_exactmatch_2026.py' -v
      - name: Vérifier la source RDF figée
        run: |
          set -euo pipefail
          echo '3a0effe42a27da20c30497a6847fc1becbb736745945f01e4321b4791f0067c7  pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf' | sha256sum -c -
      - name: Deux audits identiques des quatre cas
        working-directory: referentiels
        run: |
          set -euo pipefail
          for n in 1 2; do
            python3 scripts/auditer_pdl_quatre_sans_exactmatch_2026.py \
              --rdf ../pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf \
              --cog docs/data/lieux-chronologie/cog-pdl.json \
              --publie docs/data/lieux-chronologie/pactols-pdl-2026.json \
              --sortie "$RUNNER_TEMP/PDL-QUATRE-SANS-EXACTMATCH-$n.json"
          done
          cmp "$RUNNER_TEMP/PDL-QUATRE-SANS-EXACTMATCH-1.json" "$RUNNER_TEMP/PDL-QUATRE-SANS-EXACTMATCH-2.json"
          python3 - "$RUNNER_TEMP/PDL-QUATRE-SANS-EXACTMATCH-1.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['schema']=='adlfi.lieux.pdl.quatre_sans_exactmatch.2026.audit.v1'
          assert d['bilan']['quatre_cas_sans_exactMatch']==4
          assert d['bilan']['alignements_PDL_2026_conserves']==1140
          assert d['bilan']['exceptions_PDL_2026_conservees']==88
          assert d['bilan']['concepts_RDF_examines']==50556
          assert d['bilan']['nouveaux_ARK_valides']==0
          assert all(x['decision_editoriale']=='NON_PRISE' and x['publication']=='AUCUNE' for x in d['dossiers'])
          print('PDL_QUATRE_SANS_EXACTMATCH_AUDIT_OK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lieux-pdl-quatre-sans-exactmatch-2026
          path: ${{ runner.temp }}/PDL-QUATRE-SANS-EXACTMATCH-1.json
          retention-days: 30
          if-no-files-found: error
      - name: Archiver le rapport hors site après tests
        working-directory: referentiels
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/PDL-QUATRE-SANS-EXACTMATCH-1.json" recette/lieux/PDL-QUATRE-SANS-EXACTMATCH-RDF-2026.json
          git add -- recette/lieux/PDL-QUATRE-SANS-EXACTMATCH-RDF-2026.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Lieux PDL : qualifier les quatre codes sans exactMatch'
            git fetch origin "$HEAD_REF"
            git rebase "origin/$HEAD_REF"
            git push origin "HEAD:$HEAD_REF"
          fi
