name: Lieux PDL — quatre créations successives (recette)
on:
  pull_request:
    paths:
      - 'scripts/instruire_pdl_quatre_successions_2026.py'
      - 'tests/test_instruire_pdl_quatre_successions_2026.py'
      - 'recette/lieux/PDL-QUATRE-CREATIONS-SUCCESSIVES-2026.md'
      - '.github/workflows/lieux-pdl-quatre-successions-2026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quatre-successions:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: referentiels
      - uses: actions/checkout@v4
        with:
          repository: frantiq/PACTOLS
          ref: 69bf9697e24cefd645a69465bbd271702786285a
          path: pactols
          lfs: true
          sparse-checkout: |
            pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contrôler les périodes COG à libellé réemployé
        working-directory: referentiels
        run: python3 -m unittest discover -s tests -p 'test_instruire_pdl_quatre_successions_2026.py' -v
      - name: Récupérer les sources épinglées
        working-directory: referentiels
        run: |
          set -euo pipefail
          echo '3a0effe42a27da20c30497a6847fc1becbb736745945f01e4321b4791f0067c7  ../pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf' | sha256sum --check
          python3 scripts/recuperer_cog_2026.py --sortie "$RUNNER_TEMP/cog2026"
      - name: Vérifier deux instructions reproductibles et l'absence de publication
        working-directory: referentiels
        run: |
          set -euo pipefail
          for n in 1 2; do
            python3 scripts/instruire_pdl_quatre_successions_2026.py \
              --rdf ../pactols/pactols-latest-version/pactols_lieux_all/Pactols_Lieux_th17_20260722.rdf \
              --cog "$RUNNER_TEMP/cog2026/v_commune_2026.csv" \
              --chronologie docs/data/lieux-chronologie/cog-pdl.json \
              --sortie "$RUNNER_TEMP/quatre-successions-$n.json"
          done
          cmp "$RUNNER_TEMP/quatre-successions-1.json" "$RUNNER_TEMP/quatre-successions-2.json"
          python3 - "$RUNNER_TEMP/quatre-successions-1.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["bilan"]["communes_traitees"]==4
          assert x["bilan"]["ARK_examines"]==9
          assert x["bilan"]["validations"]==0
          assert x["bilan"]["geometries"]==0
          assert x["bilan"]["relations_historiques_inferees"]==0
          assert all(c["ark_retenu"] is None and c["publication"]=="NON_PUBLIE" for c in x["communes"])
          print("PDL_4_SUCCESSIONS_REPRODUCTIBLES")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recette-pdl-quatre-successions-2026
          path: ${{ runner.temp }}/quatre-successions-1.json
          retention-days: 30
          if-no-files-found: error
