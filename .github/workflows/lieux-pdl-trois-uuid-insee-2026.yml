name: Lieux - PDL trois UUID vers codes Insee 2026
on:
  pull_request:
    paths:
      - 'scripts/auditer_pdl_trois_uuid_insee_2026.py'
      - 'tests/test_auditer_pdl_trois_uuid_insee_2026.py'
      - '.github/workflows/lieux-pdl-trois-uuid-insee-2026.yml'
permissions:
  contents: write
jobs:
  audit-uuid-autorite-insee:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester les triplets RDF obligatoires et les contradictions
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_auditer_pdl_trois_uuid_insee_2026.py' -v
          python3 -m unittest discover -s tests -p 'test_auditer_pdl_quatre_sans_exactmatch_2026.py' -v
      - name: Acquérir les trois sources RDF officielles une seule fois
        run: |
          set -euo pipefail
          python3 scripts/auditer_pdl_trois_uuid_insee_2026.py --collecter "$RUNNER_TEMP/pdl-insee-uuid"
      - name: Analyser deux fois les mêmes preuves conservées et vérifier les cardinalités
        run: |
          set -euo pipefail
          for n in 1 2; do
            python3 scripts/auditer_pdl_trois_uuid_insee_2026.py \
              --sources "$RUNNER_TEMP/pdl-insee-uuid" \
              --pactols recette/lieux/PDL-QUATRE-SANS-EXACTMATCH-RDF-2026.json \
              --cog docs/data/lieux-chronologie/cog-pdl.json \
              --sortie "$RUNNER_TEMP/pdl-uuid-preuves-$n.json"
          done
          cmp "$RUNNER_TEMP/pdl-uuid-preuves-1.json" "$RUNNER_TEMP/pdl-uuid-preuves-2.json"
          python3 - "$RUNNER_TEMP/pdl-uuid-preuves-1.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['schema']=='adlfi.lieux.pdl.trois_uuid_insee.2026.audit.v1'
          assert d['bilan']['dossiers']==3
          assert d['bilan']['liens_PDL_deja_publies']==1140
          assert d['bilan']['nouveaux_ARK_publies']==0
          assert [x['code_COG_2026'] for x in d['dossiers']]==['44066','85165','85212']
          assert all(x['rdf_insee']['codeINSEE'] and
                     x['rdf_insee']['owl_sameAs'] for x in d['dossiers'])
          print('PDL_UUID_INSEE_OFFICIEL',d['bilan'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lieux-pdl-uuid-insee-triples-2026
          path: |
            ${{ runner.temp }}/pdl-insee-uuid
            ${{ runner.temp }}/pdl-uuid-preuves-1.json
          retention-days: 30
          if-no-files-found: error
      - name: Versionner le registre de preuve de recette, pas les sources publiques
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/pdl-uuid-preuves-1.json" recette/lieux/PDL-TROIS-UUID-INSEE-RESOLUTIONS-2026.json
          git add -- recette/lieux/PDL-TROIS-UUID-INSEE-RESOLUTIONS-2026.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Lieux PDL : archiver les preuves officielles des trois URI INSEE UUID'
            git fetch origin "$HEAD_REF"
            git rebase "origin/$HEAD_REF"
            git push origin "HEAD:$HEAD_REF"
          fi
