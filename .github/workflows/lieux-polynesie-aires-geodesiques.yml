name: Lieux — Polynésie, aires géodésiques des recouvrements

on:
  pull_request:
    paths:
      - 'scripts/quantifier_recouvrements_ispf_polynesie.py'
      - 'tests/test_quantifier_recouvrements_ispf_polynesie.py'
      - 'recette/lieux/POLYNESIE-AIRES-GEODESIQUES-2026.md'
      - '.github/workflows/lieux-polynesie-aires-geodesiques.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aires:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Préparer le moteur spatial et géodésique
        run: python3 -m pip install 'shapely==2.1.2' 'pyproj==3.7.2'
      - name: Tests de mesure ellipsoïdale
        run: python3 -m unittest discover -s tests -p 'test_quantifier_recouvrements_ispf_polynesie.py' -v
      - name: Télécharger la source originale ISPF
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 240 \
            'https://www.data.gouv.fr/api/1/datasets/r/f5ec5fb2-c173-4a94-bbd9-c12ec876a4e6' \
            --output "$RUNNER_TEMP/ispf-geojson.zip"
          echo '6302ad2a17ec1fd8b51f70f1d8ba1501ee7ca212a9cd53c8df4221faedfe0b62  '"$RUNNER_TEMP/ispf-geojson.zip" | sha256sum --check
      - name: Quantification et reproductibilité
        run: |
          python3 scripts/quantifier_recouvrements_ispf_polynesie.py \
            --archive "$RUNNER_TEMP/ispf-geojson.zip" \
            --sortie "$RUNNER_TEMP/ispf-aires-a.json"
          python3 scripts/quantifier_recouvrements_ispf_polynesie.py \
            --archive "$RUNNER_TEMP/ispf-geojson.zip" \
            --sortie "$RUNNER_TEMP/ispf-aires-b.json"
          cmp "$RUNNER_TEMP/ispf-aires-a.json" "$RUNNER_TEMP/ispf-aires-b.json"
          python3 - "$RUNNER_TEMP/ispf-aires-a.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['bilan']['paires']==65
          assert r['bilan']['paires_intra_commune']==44
          assert r['bilan']['paires_inter_communes']==21
          assert r['publication']=={'polygones':0,'autorites':0,'nouveaux_ark':0} if 'publication' in r else r['bilan']['nombre_de_contours_crees']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adlfi-polynesie-aires-geodesiques-audit
          path: ${{ runner.temp }}/ispf-aires-a.json
          retention-days: 30
          if-no-files-found: error
