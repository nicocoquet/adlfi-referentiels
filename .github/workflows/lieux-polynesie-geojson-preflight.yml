name: Lieux — Polynésie, préflight GeoJSON ISPF

on:
  pull_request:
    paths:
      - 'scripts/auditer_geojson_ispf_polynesie.py'
      - 'tests/test_auditer_geojson_ispf_polynesie.py'
      - 'recette/lieux/POLYNESIE-GEOJSON-PREFLIGHT-2026.md'
      - '.github/workflows/lieux-polynesie-geojson-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests indépendants du réseau
        run: python3 -m unittest discover -s tests -p 'test_auditer_geojson_ispf_polynesie.py' -v
      - name: Télécharger archive institutionnelle et contrôler SHA-256
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 \
            'https://www.data.gouv.fr/api/1/datasets/r/f5ec5fb2-c173-4a94-bbd9-c12ec876a4e6' \
            --output "$RUNNER_TEMP/ispf-geojson.zip"
          echo '6302ad2a17ec1fd8b51f70f1d8ba1501ee7ca212a9cd53c8df4221faedfe0b62  '"$RUNNER_TEMP/ispf-geojson.zip" | sha256sum --check
      - name: Préflight attributaire et géométrique sans publication
        run: |
          python3 scripts/auditer_geojson_ispf_polynesie.py \
            --archive "$RUNNER_TEMP/ispf-geojson.zip" \
            --sortie "$RUNNER_TEMP/geojson-preflight-a.json"
          python3 scripts/auditer_geojson_ispf_polynesie.py \
            --archive "$RUNNER_TEMP/ispf-geojson.zip" \
            --sortie "$RUNNER_TEMP/geojson-preflight-b.json"
          cmp "$RUNNER_TEMP/geojson-preflight-a.json" "$RUNNER_TEMP/geojson-preflight-b.json"
      - uses: actions/upload-artifact@v4
        with:
          name: adlfi-polynesie-geojson-preflight
          path: ${{ runner.temp }}/geojson-preflight-a.json
          retention-days: 30
          if-no-files-found: error
