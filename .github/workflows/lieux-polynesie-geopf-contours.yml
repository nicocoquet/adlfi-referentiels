name: Lieux — Polynésie, comparer contours GEO PF et ISPF

on:
  pull_request:
    paths:
      - 'scripts/comparer_contours_geopf_ispf.py'
      - 'tests/test_comparer_contours_geopf_ispf.py'
      - 'recette/lieux/POLYNESIE-GEOPF-CONTOURS-2026.md'
      - '.github/workflows/lieux-polynesie-geopf-contours.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometries:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les moteurs géospatiaux
        run: python3 -m pip install 'shapely==2.1.2' 'pyproj==3.7.2' 'pyshp==2.3.1'
      - name: Tester les invariants de géométrie
        run: python3 -m unittest discover -s tests -p 'test_comparer_contours_geopf_ispf.py' -v
      - name: Télécharger les trois sources institutionnelles
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 240 \
            'https://www.ispf.pf/content/uploads/Codes_geographiques_ce46ed21ee.xlsx' \
            --output "$RUNNER_TEMP/ispf-codes.xlsx"
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 240 \
            'https://www.data.gouv.fr/api/1/datasets/r/f5ec5fb2-c173-4a94-bbd9-c12ec876a4e6' \
            --output "$RUNNER_TEMP/ispf-geojson.zip"
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 240 \
            'https://www.data.gouv.fr/api/1/datasets/r/89d202c3-4f04-4168-842d-4c50036125c7' \
            --output "$RUNNER_TEMP/geopf.zip"
          echo 'd84f9a69f2c64f744ee0719b01c4841953019d45a1fb29b8abb0db2f3f0176e6  '"$RUNNER_TEMP/ispf-codes.xlsx" | sha256sum --check
          echo '6302ad2a17ec1fd8b51f70f1d8ba1501ee7ca212a9cd53c8df4221faedfe0b62  '"$RUNNER_TEMP/ispf-geojson.zip" | sha256sum --check
          echo '29230c18487385f84ca480e9b2c921ea389f848663a4a9574e77b9cbbf40db7b  '"$RUNNER_TEMP/geopf.zip" | sha256sum --check
      - name: Comparaison de contours et reproductibilité
        run: |
          set -euo pipefail
          python3 scripts/comparer_contours_geopf_ispf.py \
            --xlsx "$RUNNER_TEMP/ispf-codes.xlsx" \
            --ispf-geojson "$RUNNER_TEMP/ispf-geojson.zip" \
            --geopf "$RUNNER_TEMP/geopf.zip" \
            --sortie "$RUNNER_TEMP/comparaison-a.json"
          python3 scripts/comparer_contours_geopf_ispf.py \
            --xlsx "$RUNNER_TEMP/ispf-codes.xlsx" \
            --ispf-geojson "$RUNNER_TEMP/ispf-geojson.zip" \
            --geopf "$RUNNER_TEMP/geopf.zip" \
            --sortie "$RUNNER_TEMP/comparaison-b.json"
          cmp "$RUNNER_TEMP/comparaison-a.json" "$RUNNER_TEMP/comparaison-b.json"
          python3 - "$RUNNER_TEMP/comparaison-a.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['schema']=='adlfi.lieux.polynesie.geopf.ispf.contours.comparaison.v1'
          assert r['statut']=='RECETTE_NON_VALIDANTE'
          assert r['publication']=={'contours':0,'autorites':0,'ark':0}
          assert r['unites_fines_ISPF']==116 and r['entites_geopf']==179
          assert len(r['objets_geographiques_ecartes'])==4
          assert r['unites_comparees']+len(r['unites_exclues'])==116
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adlfi-polynesie-geopf-comparaison-contours
          path: ${{ runner.temp }}/comparaison-a.json
          if-no-files-found: error
          retention-days: 30
