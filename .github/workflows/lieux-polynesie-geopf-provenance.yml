name: Lieux — Polynésie, provenance GEO PF 2022

on:
  pull_request:
    paths:
      - 'scripts/inventorier_geopf_polynesie.py'
      - 'scripts/qualifier_jointures_geopf_ispf.py'
      - 'tests/test_qualifier_jointures_geopf_ispf.py'
      - 'tests/test_inventorier_geopf_polynesie.py'
      - 'recette/lieux/POLYNESIE-GEOPF-PROVENANCE-2026.md'
      - '.github/workflows/lieux-polynesie-geopf-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geopf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'pyshp==2.3.1'
      - run: python3 -m unittest discover -s tests -p 'test_inventorier_geopf_polynesie.py' -v
      - name: Vérifier les normalisations de clés
        run: python3 -m unittest discover -s tests -p 'test_qualifier_jointures_geopf_ispf.py' -v
      - name: Télécharger la ressource institutionnelle GEO PF
        run: |
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 240 \
            'https://www.data.gouv.fr/api/1/datasets/r/89d202c3-4f04-4168-842d-4c50036125c7' \
            --output "$RUNNER_TEMP/geopf-commune-associee.zip"
      - name: Télécharger le classeur officiel ISPF
        run: |
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 240 \
            'https://www.ispf.pf/content/uploads/Codes_geographiques_ce46ed21ee.xlsx' \
            --output "$RUNNER_TEMP/ispf-codes.xlsx"
          echo 'd84f9a69f2c64f744ee0719b01c4841953019d45a1fb29b8abb0db2f3f0176e6  '"$RUNNER_TEMP/ispf-codes.xlsx" | sha256sum --check
          echo '29230c18487385f84ca480e9b2c921ea389f848663a4a9574e77b9cbbf40db7b  '"$RUNNER_TEMP/geopf-commune-associee.zip" | sha256sum --check
      - name: Déterminer l'empreinte et examiner les couches
        run: |
          python3 scripts/inventorier_geopf_polynesie.py \
            --archive "$RUNNER_TEMP/geopf-commune-associee.zip" \
            --sortie "$RUNNER_TEMP/geopf-inventaire-a.json"
          python3 scripts/inventorier_geopf_polynesie.py \
            --archive "$RUNNER_TEMP/geopf-commune-associee.zip" \
            --sortie "$RUNNER_TEMP/geopf-inventaire-b.json"
          cmp "$RUNNER_TEMP/geopf-inventaire-a.json" "$RUNNER_TEMP/geopf-inventaire-b.json"
          python3 - "$RUNNER_TEMP/geopf-inventaire-a.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['statut']=='RECETTE_NON_VALIDANTE'
          assert r['independance_source_geometrique']=='NON_ETABLIE'
          assert r['publication']=={'polygones':0,'autorites':0,'ark':0}
          assert len(r['couches'])>=1
          PY
      - name: Comparer les 179 identifiants géographiques
        run: |
          python3 scripts/qualifier_jointures_geopf_ispf.py \
            --xlsx "$RUNNER_TEMP/ispf-codes.xlsx" \
            --archive "$RUNNER_TEMP/geopf-commune-associee.zip" \
            --sortie "$RUNNER_TEMP/geopf-ispf-a.json"
          python3 - "$RUNNER_TEMP/geopf-ispf-a.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['nombre_geopf']==r['nombre_xlsx']==179
          assert r['publication']=={'contours':0,'ark':0,'autorites':0}
          assert r['independance_des_geometries']=='NON_ETABLIE'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adlfi-geopf-provenance-2022
          path: |
            ${{ runner.temp }}/geopf-inventaire-a.json
            ${{ runner.temp }}/geopf-ispf-a.json
          if-no-files-found: error
          retention-days: 30
