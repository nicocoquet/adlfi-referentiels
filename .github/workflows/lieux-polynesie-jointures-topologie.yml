name: Lieux — Polynésie, jointures et topologie ISPF

on:
  pull_request:
    paths:
      - 'scripts/auditer_jointures_topologie_ispf.py'
      - 'tests/test_auditer_jointures_topologie_ispf.py'
      - 'recette/lieux/POLYNESIE-JOINTURES-TOPOLOGIE-2026.md'
      - '.github/workflows/lieux-polynesie-jointures-topologie.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-ispf:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dépendance topologique stable
        run: python3 -m pip install 'shapely==2.1.2'
      - name: Tests des garde-fous
        run: python3 -m unittest discover -s tests -p 'test_auditer_jointures_topologie_ispf.py' -v
      - name: Récupérer et contrôler les deux sources institutionnelles
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 240 \
            'https://www.ispf.pf/content/uploads/Codes_geographiques_ce46ed21ee.xlsx' \
            --output "$RUNNER_TEMP/ispf-codes.xlsx"
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 240 \
            'https://www.data.gouv.fr/api/1/datasets/r/f5ec5fb2-c173-4a94-bbd9-c12ec876a4e6' \
            --output "$RUNNER_TEMP/ispf-geojson.zip"
          echo 'd84f9a69f2c64f744ee0719b01c4841953019d45a1fb29b8abb0db2f3f0176e6  '"$RUNNER_TEMP/ispf-codes.xlsx" | sha256sum -c
          echo '6302ad2a17ec1fd8b51f70f1d8ba1501ee7ca212a9cd53c8df4221faedfe0b62  '"$RUNNER_TEMP/ispf-geojson.zip" | sha256sum -c
      - name: Audit direct des codes et géométries
        run: |
          python3 scripts/auditer_jointures_topologie_ispf.py \
            --xlsx "$RUNNER_TEMP/ispf-codes.xlsx" \
            --archive "$RUNNER_TEMP/ispf-geojson.zip" \
            --sortie "$RUNNER_TEMP/ispf-jointures-a.json"
          python3 scripts/auditer_jointures_topologie_ispf.py \
            --xlsx "$RUNNER_TEMP/ispf-codes.xlsx" \
            --archive "$RUNNER_TEMP/ispf-geojson.zip" \
            --sortie "$RUNNER_TEMP/ispf-jointures-b.json"
          cmp "$RUNNER_TEMP/ispf-jointures-a.json" "$RUNNER_TEMP/ispf-jointures-b.json"
          python3 - "$RUNNER_TEMP/ispf-jointures-a.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['schema']=='adlfi.lieux.polynesie.jointures.topologie.audit.v1'
          assert r['statut']=='RECETTE_NON_VALIDANTE'
          assert r['candidats_publication_automatique']==0
          assert r['publication']=={'contours':0,'autorites':0,'ark':0}
          for name,n in [('Com.GeoJSON',48),('Comas.GeoJSON',116),('Ile.GeoJSON',119)]:
              assert r['couches'][name]['nombre_geojson']==n
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adlfi-polynesie-jointures-topologie
          path: ${{ runner.temp }}/ispf-jointures-a.json
          if-no-files-found: error
          retention-days: 30
