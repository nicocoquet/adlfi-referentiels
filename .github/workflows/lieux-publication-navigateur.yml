name: Lieux — recette navigateur avant publication

on:
  pull_request:
    paths:
      - 'docs/lieux/**'
      - 'docs/assets/lieux-multiechelon.*'
      - 'docs/data/lieux-historique/**'
      - 'tests/test_lieux_publication_navigateur.py'
      - '.github/workflows/lieux-publication-navigateur.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Playwright et son navigateur Chromium
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright==1.58.0'
          python3 -m playwright install chromium
      - name: Tester la navigation intégrée en navigateur réel
        run: python3 tests/test_lieux_publication_navigateur.py
      - name: Archiver la capture de recette
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adlfi-lieux-publication-capture
          path: /tmp/lieux-publication.png
          if-no-files-found: ignore
          retention-days: 14
