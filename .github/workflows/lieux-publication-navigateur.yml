name: Lieux — recette navigateur avant publication

on:
  pull_request:
    paths:
      - 'docs/lieux/**'
      - 'docs/assets/lieux-multiechelon.*'
      - 'docs/assets/lieux-outremer-search.js'
      - 'docs/assets/lieux-guyane-historique.js'
      - 'docs/assets/lieux-martinique-historique.js'
      - 'docs/assets/lieux-guadeloupe-historique.js'
      - 'docs/assets/lieux-reunion-historique.js'
      - 'docs/data/lieux-reunion/**'
      - 'tests/test_lieux_reunion_historique.js'
      - 'docs/data/lieux-guadeloupe/**'
      - 'tests/test_lieux_guadeloupe_historique.js'
      - 'docs/data/lieux-martinique/**'
      - 'tests/test_lieux_martinique_historique.js'
      - 'docs/data/lieux-guyane/**'
      - 'tests/test_lieux_guyane_historique.js'
      - 'docs/data/lieux-outremer/**'
      - 'tests/test_lieux_outremer_search.js'
      - 'docs/data/lieux-historique/**'
      - 'tests/test_lieux_publication_navigateur.py'
      - '.github/workflows/lieux-publication-navigateur.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier le contrat statique du gabarit Lieux
        run: python3 -m unittest discover -s tests -p 'test_lieux_ui.py' -v
      - name: Tester les 233 identités COG ultramarines (Node.js)
        run: node tests/test_lieux_outremer_search.js
      - name: Tester les 41 états historiques COG de Guyane (Node.js)
        run: node tests/test_lieux_guyane_historique.js
      - name: Tester les 34 périodes historiques COG de Martinique (Node.js)
        run: node tests/test_lieux_martinique_historique.js
      - name: Tester les 35 épisodes COG Guadeloupe (Node.js)
        run: node tests/test_lieux_guadeloupe_historique.js
      - name: Tester les 24 épisodes COG Réunion et la division de 1965 (Node.js)
        run: node tests/test_lieux_reunion_historique.js
      - name: Installer Playwright et son navigateur Chromium
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright==1.58.0'
          python3 -m playwright install chromium
      - name: Tester la navigation intégrée en navigateur réel
        run: python3 tests/test_lieux_publication_navigateur.py
      - name: Archiver la capture de recette
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adlfi-lieux-publication-capture
          path: /tmp/lieux-*.png
          if-no-files-found: ignore
          retention-days: 14
