name: Lieux — recherche COG par millésime et homonymes

on:
  pull_request:
    paths:
      - 'docs/assets/lieux-recherche-millesime.js'
      - 'docs/assets/lieux-multiechelon.js'
      - 'docs/lieux/index.html'
      - 'tests/test_lieux_recherche_millesime.js'
      - 'tests/test_lieux_recherche_millesime_navigateur.py'
      - 'tests/test_lieux_ui.py'
      - '.github/workflows/lieux-recherche-millesime.yml'
      - 'recette/lieux/RECHERCHE-COG-MILLESIME-2026.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recherche-chronologique:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contrats COG, JS et interface
        run: |
          set -euo pipefail
          node --check docs/assets/lieux-recherche-millesime.js
          node --check docs/assets/lieux-multiechelon.js
          node tests/test_lieux_recherche_millesime.js
          python3 -m unittest discover -s tests -p 'test_lieux_ui.py' -v
      - name: Installer Chromium
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.58.0
          python3 -m playwright install chromium
      - name: Recherche Afa 1975/2026 avec preuves COG
        run: python3 tests/test_lieux_recherche_millesime_navigateur.py
      - name: Non-régression navigation sur les cinq régions
        run: |
          set -euo pipefail
          python3 tests/test_lieux_chargement_progressif_navigateur.py
          python3 tests/test_lieux_normandie_navigateur.py
