<h1>La chronologie communale est intégrée au module Lieux</h1>
<p>La navigation historique, la recherche Pactols–COG et les couches territoriales sont réunies sur une seule carte.</p>
<p><a id="continue" href="../">Ouvrir le référentiel Lieux</a></p>
<script>
(function(){
 'use strict';
 const destination=new URL('../',location.href);
 const incoming=new URLSearchParams(location.search);
 for(const [key,value] of incoming)destination.searchParams.append(key,value);
 destination.hash=location.hash;
 document.getElementById('continue').href=destination.href;
 location.replace(destination.href);
}());
</script>
